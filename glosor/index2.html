<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <!-- Stoppa zoom på iPhone + stöd för notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Flashcards – FR ↔ SV</title>
  <style>
    :root{
      --bg1: #0f1226;
      --bg2: #151a3a;
      --acc1: #9b8cff;
      --acc2: #2ec5ff;
      --acc3: #00e3a2;
      --text: #e9ecf1;
      --muted:#9aa3b2;
      --glass:#ffffff14;
      --shadow: 0 20px 40px rgba(0,0,0,.35);
      --radius: 22px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color: transparent}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;
      color:var(--text);
      background: radial-gradient(1200px 800px at 20% -10%, #261a62 0%, transparent 40%),
                  radial-gradient(900px 600px at 120% 20%, #0a6cd8 0%, transparent 35%),
                  linear-gradient(160deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
    }
    .container{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px;padding-bottom: calc(16px + env(safe-area-inset-bottom));}
    header{width:100%;max-width:820px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px 6px;}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc1),var(--acc2));box-shadow: inset 0 0 14px #ffffff40, 0 6px 16px #0006}
    h1{font-size:20px;letter-spacing:.3px;margin:0;font-weight:700;opacity:.95}
    .sub{font-size:12px;color:var(--muted);margin-top:2px}

    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .segmented{display:flex;background:var(--glass);border:1px solid #ffffff22;border-radius:999px;padding:4px;backdrop-filter: blur(10px);-webkit-backdrop-filter: blur(10px)}
    .segmented button{appearance:none;border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:999px;font-weight:600;letter-spacing:.2px;touch-action: manipulation}
    .segmented button.active{background:linear-gradient(135deg,#ffffff1f,#ffffff08);color:var(--text);box-shadow:0 6px 14px #0005,inset 0 0 0 1px #ffffff22}

    main{width:100%;max-width:820px;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center}

    .card-wrap{perspective:1400px;width:100%}
    .card{position:relative;width:100%;min-height:46vh;max-height:64vh;border-radius:var(--radius);background: linear-gradient(180deg, #0b0f25, #0b102c);border: 1px solid #ffffff1c;box-shadow: var(--shadow), inset 0 0 0 1px #ffffff10;overflow:hidden;user-select:none}
    /* Front/back roteras – inte hela kortet → undvik spegelvänd text på iOS */
    .card-inner{position:absolute;inset:0;padding:28px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition: transform 700ms cubic-bezier(.2,.8,.2,1)}
    .card .front{transform: rotateY(0deg)}
    .card .back{transform: rotateY(180deg)}
    .card.flipped .front{transform: rotateY(180deg)}
    .card.flipped .back{transform: rotateY(0deg)}

    .prompt{font-size: clamp(22px, 4.8vw, 36px); line-height:1.25; text-align:center; letter-spacing:.2px}
    .note{margin-top:10px;color:var(--muted);font-size:13px;text-align:center}

    .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;width:100%}
    .btn{appearance:none;border:0;border-radius:14px;padding:14px 16px;font-weight:700;letter-spacing:.3px;cursor:pointer;transition: transform .08s ease, filter .2s ease; backdrop-filter: blur(8px);-webkit-backdrop-filter: blur(8px); touch-action: manipulation}
    .btn:active{transform:scale(.98)}
    .primary{color:#0b1220;background:linear-gradient(135deg,var(--acc3),var(--acc2));box-shadow:0 12px 30px #00c7a933,inset 0 0 0 1px #ffffff60}
    .ghost{color:var(--text);background: #ffffff10;border:1px solid #ffffff1f}

    footer{width:100%;max-width:820px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:8px 4px 12px;color:var(--muted)}
    .mini{font-size:12px}

    /* iPhone safe-area breathing room */
    .sticky-bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:3}

    @media (hover: hover){
      .card:hover{box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 0 0 1px #ffffff18}
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Flashcards – Indefinita pronomen</h1>
          <div class="sub">Franska ↔ Svenska · Tryck för att vända · Svep för nästa</div>
        </div>
      </div>
      <div class="controls">
        <div class="segmented" role="tablist" aria-label="Studieläge">
          <button id="mode-mix" class="active" role="tab" aria-selected="true">Blandad</button>
          <button id="mode-frsv" role="tab" aria-selected="false">FR → SV</button>
          <button id="mode-svfr" role="tab" aria-selected="false">SV → FR</button>
        </div>
      </div>
    </header>

    <main>
      <div class="card-wrap">
        <div id="card" class="card" aria-live="polite">
          <div class="card-inner front">
            <div class="front-text">
              <div class="prompt" id="frontText">Laddar…</div>
              <div class="note">Tryck för att vända</div>
            </div>
          </div>
          <div class="card-inner back">
            <div class="back-text">
              <div class="prompt" id="backText">—</div>
              <div class="note">Tryck igen för att vända tillbaka</div>
            </div>
          </div>
        </div>
      </div>

      <div class="actions sticky-bar">
        <button id="btn-flip" class="btn ghost" aria-label="Vänd kort">↺ Vänd</button>
        <button id="btn-next" class="btn primary" aria-label="Nästa kort">🎲 Nästa kort</button>
      </div>
    </main>

    <footer>
      <div class="mini">Källa: kursblad "les pronoms indéfinis"</div>
      <div class="mini">Kort i quizzet: <span id="countBadge">…</span></div>
    </footer>
  </div>

  <script>
    // --- Dataset ------------------------------------------------------------
    // Varje post: { fr: "…", sv: "…" }
    const PAIRS = [
      {fr:"chaque", sv:"varje"},
      {fr:"tous", sv:"alla"},
      {fr:"tout", sv:"allt; helt"},
      {fr:"toute", sv:"helt (fem); allt; hela"},
      {fr:"quelqu’un", sv:"någon"},
      {fr:"quelque chose", sv:"något"},
      {fr:"quelques", sv:"några"},
      {fr:"quelques-uns / quelques-unes", sv:"några av"},
      {fr:"ne…rien", sv:"ingenting"},
      {fr:"ne…personne", sv:"ingen"},
      {fr:"ne…aucun(e)", sv:"inte en enda; ingen; inget"},
      {fr:"aucun(e) de … ne", sv:"ingen av"},
      {fr:"chacun / chacune", sv:"var och en"},
      {fr:"plusieurs", sv:"flera; många; åtskilliga"},
      {fr:"ne…pas de", sv:"ingen/inga (noll kvantitet)"},
      {fr:"la plupart", sv:"de flesta"},
      {fr:"n’importe qui", sv:"vem som helst"},
      {fr:"n’importe quoi", sv:"vad som helst"},
      {fr:"n’importe lequel/laquelle", sv:"vilken som helst"},
      {fr:"on", sv:"man; vi (i talspråk)"},
      {fr:"quiconque", sv:"vem som helst; den som"},

      {fr:"Tu connais quelqu’un à Västerås ?", sv:"Känner du någon i Västerås?"},
      {fr:"Non, je ne connais personne.", sv:"Nej, jag känner ingen."},
      {fr:"Personne ne connaît Vallby.", sv:"Ingen känner till Vallby."},
      {fr:"Quelqu’un habite à Vallby ?", sv:"Bor någon i Vallby?"},
      {fr:"Il n’y a rien à Vallby.", sv:"Det finns ingenting i Vallby."},
      {fr:"Rien ne se passe à Vallby.", sv:"Ingenting händer i Vallby."},
      {fr:"J’ai quelques amis à Nice.", sv:"Jag har några kompisar i Nice."},
      {fr:"Quelques-uns de mes amis à La Réunion ne connaissent pas l’Europe.", sv:"Några av mina vänner på La Réunion känner inte till Europa."},
      {fr:"Tous connaissent la ville de Saint-Denis.", sv:"Alla känner till staden Saint-Denis."},
      {fr:"Aucun ne connaît la Suède.", sv:"Inte en enda känner till Sverige."},
      {fr:"J’ai tout compris.", sv:"Jag har förstått allt."},
      {fr:"Chaque vendredi je vais au marché de Saint-Paul.", sv:"Varje fredag åker jag till marknaden i Saint-Paul."},
      {fr:"Tous mes amis vont au Zanzibar Café vendredi soir.", sv:"Alla mina vänner går till Zanzibar Café på fredag kväll."},
      {fr:"Chacun paie sa tournée.", sv:"Var och en betalar sin omgång."},
      {fr:"Chaque verre de sirop coûte 1,50 €.", sv:"Varje glas saft kostar 1,50 euro."},
      {fr:"Chacun de mes amis boit un verre.", sv:"Var och en av mina vänner dricker ett glas."},
      {fr:"Certains boivent du jus de fruits, d’autres boivent du café.", sv:"Vissa dricker fruktjuicer, andra dricker kaffe."},
      {fr:"Chacune des boissons est française.", sv:"Var och en av dryckerna är franska."},
      {fr:"Aucun des élèves de Stefan ne connaît La Bourboule.", sv:"Ingen av Stefans elever känner till La Bourboule."},
      {fr:"Certains élèves connaissent La Réunion.", sv:"Vissa elever känner till La Réunion."},
      {fr:"Certains de mes élèves sont partis à La Réunion à Pâques.", sv:"Vissa av mina elever åkte till La Réunion i påskas."},
      {fr:"D’autres vont y aller l’année prochaine.", sv:"Andra ska åka dit nästa år."},
      {fr:"Personne ne parle anglais à La Réunion.", sv:"Ingen pratar engelska på La Réunion."},
      {fr:"Aucun des élèves ne parle le créole.", sv:"Ingen av eleverna talar kreol."},
      {fr:"Quelques élèves parlent le créole.", sv:"Några elever talar kreol."},
      {fr:"Quelques-uns des élèves du lycée Levavasseur parlent le créole.", sv:"Några av eleverna från gymnasiet Levavasseur talar kreol."},
      {fr:"Certains élèves du lycée Levavasseur vont venir en Suède l’année prochaine.", sv:"Vissa elever från gymnasiet Levavasseur ska komma till Sverige nästa år."},

      {fr:"La plupart des Suédois ne fument pas.", sv:"De flesta svenskar röker inte."},
      {fr:"Certaines plages sont interdites à la baignade.", sv:"Vissa stränder är förbjudna för badande."},
      {fr:"Tu es certain ?", sv:"Är du säker?"},
      {fr:"Il y a eu plusieurs attaques de requin ici.", sv:"Det har varit flera hajattacker här."},
      {fr:"Il faut trouver d’autres solutions.", sv:"Man måste hitta andra lösningar."},
      {fr:"La plupart des jeunes adorent jouer sur leur portable.", sv:"De flesta unga älskar att spela på sin mobil."},
      {fr:"Il y a d’autres possibilités ?", sv:"Finns det andra möjligheter?"},

      {fr:"Je ne sais qui.", sv:"Jag vet inte vem."},
      {fr:"Je ne sais quoi.", sv:"Jag vet inte vad."},
      {fr:"Je ne sais lequel.", sv:"Jag vet inte vilken."},
      {fr:"L’un, l’autre.", sv:"Den ena, den andra."},
      {fr:"L’un et l’autre.", sv:"Den ena och den andra; båda två."},
      {fr:"L’un ou l’autre.", sv:"Den ena eller den andra."},

      {fr:"Il n’y a personne.", sv:"Det finns ingen."},
      {fr:"Il était seul, sans personne à qui parler.", sv:"Han var ensam utan någon att prata med."},
      {fr:"As-tu rencontré quelqu’un ? — Personne.", sv:"Har du träffat någon? — Ingen."},
      {fr:"Elle chante comme personne.", sv:"Hon sjunger som ingen annan."},
      {fr:"Il sort sans que quelqu’un s’en aperçoive.", sv:"Han går ut utan att någon märker det."},
      {fr:"Il n’est pas question que quelqu’un abandonne.", sv:"Det kommer inte på fråga att någon ger upp."},
      {fr:"Vous le savez mieux que quiconque.", sv:"Ni vet det bättre än vem som helst."},
      {fr:"Il n’y a personne de sérieux ici.", sv:"Det finns ingen seriös här."},
      {fr:"Il n’y a personne d’aussi fou que lui.", sv:"Det finns ingen så galen som han."},
      {fr:"Personne d’autre qu’elle ne peut faire ce travail.", sv:"Ingen annan än hon kan göra detta arbete."},

      {fr:"Est-ce que tu cherches quelque chose ?", sv:"Letar du efter något?"},
      {fr:"Il lui est arrivé quelque chose.", sv:"Det har hänt honom något."},
      {fr:"Cette œuvre, c’est quelque chose !", sv:"Det här verket, det är något!"},
      {fr:"Il s’est produit quelque chose d’étrange.", sv:"Det skedde något konstigt."},
      {fr:"Elle m’a raconté quelque chose d’assez drôle.", sv:"Hon berättade något ganska roligt för mig."},
      {fr:"Je n’aime pas les brocolis : puis-je avoir quelque chose d’autre à la place ?", sv:"Jag gillar inte broccoli: kan jag få någonting annat i stället?"},
      {fr:"Quelque chose est arrivé.", sv:"Något har hänt."},
      {fr:"Elle a vu quelque chose d’intéressant.", sv:"Hon såg något intressant."},

      {fr:"Il est aussi kompetent que quiconque.", sv:"Han är lika kompetent som vem som helst."},
      {fr:"Il a agi sans en faire part à quiconque.", sv:"Han handlade utan att meddela någon det."},
      {fr:"Quiconque casse quelque chose doit payer la facture.", sv:"Vem som än har sönder något måste betala räkningen."},

      {fr:"Je ne vois rien.", sv:"Jag ser ingenting."},
      {fr:"Rien ne va plus.", sv:"Ingenting går längre."},
      {fr:"Qu’as-tu compris ? — Rien.", sv:"Vad har du förstått? — Ingenting."},
      {fr:"C’est mieux que rien.", sv:"Det är bättre än ingenting."},
      {fr:"Vous êtes venus pour rien.", sv:"Ni har kommit för ingenting (förgäves)."},
      {fr:"Nous sommes restés sans rien dire.", sv:"Vi stannade utan att säga något."},
      {fr:"A-t-on jamais rien vu de pareil ?", sv:"Har man någonsin sett något liknande?"},
      {fr:"Il est incapable de rien manger pendant trois jours.", sv:"Han är oförmögen att äta något under tre dagar."},
      {fr:"Il n’y a rien de nouveau.", sv:"Det finns ingenting nytt."},
      {fr:"Je n’ai jamais rien vu d’aussi beau.", sv:"Jag har aldrig sett något så vackert."},
      {fr:"Elle n’aime rien d’autre que la musique.", sv:"Hon gillar ingenting annat än musik."},
      {fr:"Ne dis rien qui puisse te compromettre.", sv:"Säg ingenting som kan fördärva dig."},

      {fr:"J’ai tout rangé.", sv:"Jag har iordningställt allt."},
      {fr:"Tout est parfait.", sv:"Allt är perfekt."},
      {fr:"Tous l’ont félicité.", sv:"Alla gratulerade honom."},
      {fr:"Pose-lui la question une fois pour toutes.", sv:"Ställ honom frågan en gång för alla."},
      {fr:"Il ne peut pas tout faire.", sv:"Han kan inte göra allt."},
      {fr:"Il a tout mangé.", sv:"Han har ätit allt."},
      {fr:"Tout délit sera puni.", sv:"Allt brott kommer att bli straffat."},
      {fr:"Tous les hivers, nous partons à la montagne.", sv:"Alla vintrar åker vi till fjällen."},
      {fr:"Elle est tout étonnée.", sv:"Hon är alldeles förvånad."}
    ];

    // --- State --------------------------------------------------------------
    const state = { mode: 'mix', lastIndex: -1, frontIsFR: true };

    // --- Helpers ------------------------------------------------------------
    const rand = (n)=> Math.floor(Math.random()*n);

    function pickNext(){
      let i;
      do { i = rand(PAIRS.length); } while (PAIRS.length>1 && i === state.lastIndex);
      state.lastIndex = i;
      if(state.mode==='fr2sv') state.frontIsFR = true;
      else if(state.mode==='sv2fr') state.frontIsFR = false;
      else state.frontIsFR = Math.random() < 0.5;
      const item = PAIRS[i];
      render(state.frontIsFR ? item.fr : item.sv, state.frontIsFR ? item.sv : item.fr, true);
    }

    function render(front, back, resetFlip){
      const card = document.getElementById('card');
      document.getElementById('frontText').textContent = front;
      document.getElementById('backText').textContent  = back;
      if(resetFlip) card.classList.remove('flipped');
    }

    function updateCount(){
      const el = document.getElementById('countBadge');
      if(el) el.textContent = PAIRS.length;
    }

    // --- UI wiring ----------------------------------------------------------
    const cardEl = document.getElementById('card');
    cardEl.addEventListener('click', ()=> cardEl.classList.toggle('flipped'));

    const btnFlip = document.getElementById('btn-flip');
    const btnNext = document.getElementById('btn-next');

    btnFlip.addEventListener('click', (e)=>{ e.preventDefault(); cardEl.classList.toggle('flipped'); });
    btnNext.addEventListener('click', (e)=>{ e.preventDefault(); pickNext(); });

    // Double‑tap zoom guard för iOS på knappar
    let lastTouchEnd = 0;
    function preventDoubleTapZoom(e){
      const now = Date.now();
      if (now - lastTouchEnd <= 300) { e.preventDefault(); }
      lastTouchEnd = now;
    }
    for (const el of [btnFlip, btnNext]){
      el.addEventListener('touchend', preventDoubleTapZoom, {passive:false});
    }

    // Läge-knappar
    function setMode(m){
      state.mode = m;
      for (const id of ['mode-mix','mode-frsv','mode-svfr']) {
        const el = document.getElementById(id);
        el.classList.toggle('active',
          (m==='mix'  && id==='mode-mix') ||
          (m==='fr2sv'&& id==='mode-frsv')||
          (m==='sv2fr'&& id==='mode-svfr'));
        el.setAttribute('aria-selected', el.classList.contains('active'));
      }
      pickNext();
    }

    document.getElementById('mode-mix').addEventListener('click', ()=> setMode('mix'));
    document.getElementById('mode-frsv').addEventListener('click', ()=> setMode('fr2sv'));
    document.getElementById('mode-svfr').addEventListener('click', ()=> setMode('sv2fr'));

    // Svep: vänster eller höger ⇒ nästa kort
    let touchStartX = 0, touchEndX = 0;
    cardEl.addEventListener('touchstart', e=>{ touchStartX = e.changedTouches[0].screenX; }, {passive:true});
    cardEl.addEventListener('touchend', e=>{
      touchEndX = e.changedTouches[0].screenX;
      const dx = touchEndX - touchStartX;
      if (Math.abs(dx) > 50) { e.preventDefault(); pickNext(); }
    }, {passive:false});

    // Init
    updateCount();
    setMode('mix');
    updateCount();
  </script>
</body>
</html>
