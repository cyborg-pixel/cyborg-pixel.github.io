<!DOCTYPE html>
<html lang="sv"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nästa avgångar - Tranholmen</title>
  <script src="weather.js" defer></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#cfe8ff">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 1.0em;
      margin: 0;
      padding: 20px;
      background: linear-gradient(90deg, #e3f2fd 0%, #90caf9 100%, #42a5f5 200%);
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }

    h2 {
       font-size: 1.2em;
       margin-top: 2px;
       margin-bottom: 5px;
       line-height: 1.0;
    }
    ul {
      font-size: 0.9em; 
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .site-box {
      width: 90%;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      padding: 10px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }

    .departure-to-city {
      background-color: rgba(255, 200, 220, 0.8);
    }

    .departure-to-island {
      background-color: rgba(200, 230, 200, 0.8);
    }

    .big {
      font-weight: bold;
      font-size: 1.0em;
    }

    .refresh-button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1em;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .refresh-button:hover {
      background-color: #0056b3;
    }

    .config-link {
      margin-top: 20px;
      font-size: 0.8em;
      cursor: pointer;
      text-decoration: underline;
      color: #004488;
    }

    .hidden {
      display: none;
    }

    .config-section {
      width: 90%;
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body onload="startAutoRefresh()">
  <div id="weather-summary" style="position: absolute; top: 0; right: 8%; font-size: 13px; padding: 3px; border-radius: 5px;">
    Laddar väderdata...
  </div>

  <div class="site-box departure-to-island">
    <h2>Färja 80 Tranholmen</h2>
    <ul id="farja"></ul>
  </div>
  <div class="site-box departure-to-island">
    <h2>Buss 601 Svanholmsvägen</h2>
    <ul id="buss"></ul>
  </div>
  <div class="site-box departure-to-island">
    <h2>Buss 50 Lektorsstigen</h2>
    <ul id="lektorsstigen"></ul>
  </div>
  <div class="site-box departure-to-city">
    <h2>Färja 80 Ropsten</h2>
    <ul id="ropsten"></ul>
  </div>
  <div class="site-box departure-to-city">
    <h2>Buss 601 Danderyds sjukhus</h2>
    <ul id="ds"></ul>
  </div>
  <div class="site-box departure-to-city">
    <h2>Buss 50 Odenplan</h2>
    <ul id="odenplan"></ul>
  </div>

  <div class="config-link" onclick="toggleConfig(true)">Konfigurationsläge</div>
  <div id="config-view" class="hidden config-section"></div>

  <script>
    const stops = [
      { id: 'farja', title: 'Färja 80 Tranholmen', siteId: 961, mode: 'SHIP', line: '80', dir: 1, bg: 'departure-to-island', filter: 'Ropsten' },
      { id: 'buss', title: 'Buss 601 Svanholmsvägen', siteId: 2103, mode: 'BUS', line: '601', dir: 2, bg: 'departure-to-island' },
      { id: 'lektorsstigen', title: 'Buss 50 Lektorsstigen', siteId: 1180, mode: 'BUS', line: '50', dir: 2, bg: 'departure-to-island' },
      { id: 'ropsten', title: 'Färja 80 Ropsten', siteId: 9220, mode: 'SHIP', line: '80', dir: 1, bg: 'departure-to-city' },
      { id: 'ds', title: 'Buss 601 Danderyds sjukhus', siteId: 9201, mode: 'BUS', line: '601', dir: 1, bg: 'departure-to-city' },
      { id: 'odenplan', title: 'Buss 50 Odenplan', siteId: 9117, mode: 'BUS', line: '50', dir: 1, bg: 'departure-to-city' },
    ];

    function loadPreferences() {
      return JSON.parse(localStorage.getItem('visibleStops') || '{}');
    }

    function savePreferences(prefs) {
      localStorage.setItem('visibleStops', JSON.stringify(prefs));
    }

    function toggleConfig(show) {
      document.getElementById('config-view').classList.toggle('hidden', !show);
      document.querySelectorAll('.site-box').forEach(el => el.classList.toggle('hidden', show));
      if (show) renderConfig();
    }

    function renderConfig() {
      const prefs = loadPreferences();
      const config = document.getElementById('config-view');
      config.innerHTML = '<h2>Välj vilka hållplatser som ska visas</h2>';
      const form = document.createElement('form');
      stops.forEach(stop => {
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.name = stop.id;
        checkbox.checked = prefs[stop.id] !== false;
        label.appendChild(checkbox);
        label.append(` ${stop.title}`);
        form.appendChild(label);
        form.appendChild(document.createElement('br'));
      });
      const saveBtn = document.createElement('button');
      saveBtn.textContent = 'Spara';
      saveBtn.type = 'submit';
      saveBtn.className = 'refresh-button';
      form.appendChild(saveBtn);
      form.onsubmit = e => {
        e.preventDefault();
        const newPrefs = {};
        stops.forEach(stop => {
          newPrefs[stop.id] = form.elements[stop.id].checked;
        });
        savePreferences(newPrefs);
        toggleConfig(false);
        updateDepartures();
      };
      config.appendChild(form);
    }

    async function fetchDepartures(siteId, transportMode, lineNumber, directionCode, forecast, elementId, destinationFilter = '') {
      const url = `https://transport.integration.sl.se/v1/sites/${siteId}/departures?forecast=${forecast}&direction=${directionCode}`;
      try {
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();
        const departures = data.departures
          .filter(dep => dep.line && dep.line.transport_mode === transportMode && dep.line.designation === lineNumber && (!destinationFilter || dep.destination.includes(destinationFilter)))
          .slice(0, 5);
        const listElement = document.getElementById(elementId);
        listElement.innerHTML = '';
        if (departures.length === 0) {
          listElement.innerHTML = '<li>Inga avgångar hittades.</li>';
          return;
        }
        departures.forEach((dep, idx) => {
          const displayTime = dep.display;
          const li = document.createElement('li');
          if (idx === 0) li.classList.add('big');
          li.innerHTML = ` ${displayTime} → ${dep.destination}`;
          listElement.appendChild(li);
        });
      } catch (err) {
        console.error(err);
      }
    }

    function updateDepartures() {
      const prefs = loadPreferences();
      stops.forEach(stop => {
        if (prefs[stop.id] === false) return;
        fetchDepartures(stop.siteId, stop.mode, stop.line, stop.dir, 360, stop.id, stop.filter);
      });
    }

    function startAutoRefresh() {
      updateDepartures();
      setInterval(updateDepartures, 30000);
    }

    document.addEventListener("visibilitychange", function() {
      if (!document.hidden) {
        updateDepartures();
      }
    });
  </script>
</body>
</html>
