<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nästa avgångar - Tranholmen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 0.9em;
      margin: 0;
      padding: 0;
      background: linear-gradient(90deg, #e3f2fd 0%, #90caf9 100%, #42a5f5 200%);
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    #main-view {
      width: 100%;
      max-width: 800px;
      padding: 20px;
      box-sizing: border-box;
    }

    h2 {
      font-size: 1.2em;
      margin-top: 2px;
      margin-bottom: 5px;
      line-height: 1.0;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .site-box {
      width: 100%;
      border-radius: 15px;
      padding: 10px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    .departure-to-city {
      background-color: rgba(255, 200, 220, 0.8);
    }

    .departure-to-island {
      background-color: rgba(200, 230, 200, 0.8);
    }

    .schoolferry-box {
      background-color: #e6ccff;
    }

    .big {
      font-weight: bold;
      font-size: 1.0em;
    }
  </style>
</head>
<body onload="startAutoRefresh()">
  <div id="main-view"></div>

  <script>
    const schoolFerryConfig = {
      startDate: '2025-04-22',
      endDate: '2025-06-13T23:59:59',
      redDays: ['2025-05-01', '2025-05-29', '2025-05-30', '2025-06-06', '2025-06-09']
    };

    const schoolFerryTrips = [
      { from: "Tranholmen", departure: "07:20", to: "Stocksunds hamn", arrival: "07:30" },
      { from: "Tranholmen", departure: "07:45", to: "Lagman Linds väg", arrival: "07:50" },
      { from: "Lagman Linds väg", departure: "07:50", to: "Stocksunds hamn", arrival: "08:00" },
      { from: "Stocksunds hamn", departure: "15:15", to: "Lagman Linds väg", arrival: "15:25" },
      { from: "Lagman Linds väg", departure: "15:25", to: "Tranholmen", arrival: "15:30" },
      { from: "Stocksunds hamn", departure: "16:25", to: "Lagman Linds väg", arrival: "16:35" },
      { from: "Lagman Linds väg", departure: "16:35", to: "Tranholmen", arrival: "16:40" }
    ];

    function isRedDay(date) {
      const iso = date.toISOString().split('T')[0];
      return schoolFerryConfig.redDays.includes(iso);
    }

    function renderSchoolFerryWidget() {
      const now = new Date();
      const startDate = new Date(schoolFerryConfig.startDate);
      const endDate = new Date(schoolFerryConfig.endDate);
      const isActivePeriod = now >= startDate && now <= endDate;
      const textColor = isActivePeriod ? 'black' : '#aaa';
      const box = document.createElement('div');
      box.className = 'site-box schoolferry-box';
      const ul = document.createElement('ul');
      ul.style.color = textColor;

      const futureTrips = schoolFerryTrips.map(trip => {
        const [h, m] = trip.departure.split(":").map(Number);
        const dep = new Date(now);
        dep.setHours(h, m, 0, 0);
        if (dep < now) dep.setDate(dep.getDate() + 1);
        return { ...trip, depDate: dep };
      }).filter(trip => {
        const diffMin = (trip.depDate - now) / 60000;
        const weekday = trip.depDate.getDay();
        return diffMin >= 0 && diffMin <= 1440 &&
               weekday >= 1 && weekday <= 5 &&
               !isRedDay(trip.depDate);
      }).sort((a, b) => a.depDate - b.depDate).slice(0, 3);

      if (futureTrips.length === 0) {
        ul.innerHTML = '<li>Inga avgångar hittades.</li>';
      } else {
        futureTrips.forEach((trip, index) => {
          const diffMin = Math.round((trip.depDate - now) / 60000);
          let depText = '';
          if (diffMin < 1) depText = 'Nu';
          else if (diffMin < 60) depText = `${diffMin} min`;
          else depText = trip.departure;
          const li = document.createElement('li');
          if (index === 0) li.classList.add('big');
          li.textContent = `${depText} ${trip.from} → ${trip.to}`;
          ul.appendChild(li);
        });
      }

      box.innerHTML = '<h2>Skolbåten</h2>';
      box.appendChild(ul);
      document.getElementById('main-view').appendChild(box);
    }

    function startAutoRefresh() {
      document.getElementById('main-view').innerHTML = '';
      renderSchoolFerryWidget();
      setInterval(renderSchoolFerryWidget, 30000);
    }
  </script>
</body>
</html>
