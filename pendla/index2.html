<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photo Capture Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 1em; }
    #previews img { max-width: 100%; margin-bottom: 1em; border: 1px solid #ccc; padding: 4px; border-radius: 4px; }
    button { padding: 0.5em 1em; font-size: 1em; }
  </style>
</head>
<body>
  <h1>Ta flera foton</h1>
  <p>Välj eller ta nya foton med din iPhone:</p>
  <input type="file" id="fileInput" accept="image/*" capture="environment" multiple />
  <div id="previews"></div>
  <button id="uploadBtn" disabled>Skicka till webhook (demo)</button>

  <script>
    const fileInput = document.getElementById('fileInput');
    const previews = document.getElementById('previews');
    const uploadBtn = document.getElementById('uploadBtn');
    let files = [];

    // När användaren valt foton, visa förhandsvisningar
    fileInput.addEventListener('change', (e) => {
      files = Array.from(e.target.files);
      previews.innerHTML = '';
      files.forEach(file => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        previews.appendChild(img);
      });
      uploadBtn.disabled = files.length === 0;
    });

    // Klick på Skicka-knappen simulerar en post till webhook
    uploadBtn.addEventListener('click', async () => {
      if (files.length === 0) return;
      // Demo: fake-posta till webhook genom att logga i console
      files.forEach(file => {
        console.log('Fejk-postar fil till webhook:', file.name);
        /*
        // Riktig POST till webhook (kommenterad i denna demo):
        const formData = new FormData();
        formData.append('file', file, file.name);
        fetch('https://din-webhook-url.com/endpoint', {
          method: 'POST',
          body: formData
        })
        .then(res => console.log('Respons från webhook:', res))
        .catch(err => console.error('Fel vid webhook-post:', err));
        */
      });
      alert('Foton har "posterats" till webhook (demo).');
    });
  </script>
</body>
</html>
