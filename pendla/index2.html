<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nästa avgångar - Tranholmen</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#cfe8ff">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 0.85em;
      margin: 0;
      padding: 20px;
      background: linear-gradient(90deg, #e3f2fd 0%, #90caf9 100%, #42a5f5 200%);
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }

    h2 {
       font-size: 1.2em; /* Minskar storleken lite, testa även 1.1em om du vill ha ännu mindre */
       margin-bottom: 5px; /* Minskar avståndet under h2 */
       line-height: 1.0; /* Justerar radavstånd inom rubriken */
    }
ul {
  font-size: 0.9em; 
  list-style-type: none; /* Tar bort bullets */
  padding: 0; /* Tar bort indrag */
  margin: 0; /* Tar bort marginaler */
}
  
    .site-box {
      width: 90%;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      padding: 7px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }

    .departure-to-city {
      background-color: rgba(255, 200, 220, 0.8);
    }

    .departure-to-island {
      background-color: rgba(200, 230, 200, 0.8);
    }

    .big {
      font-weight: bold;
      font-size: 1.0em;
    }

    .refresh-button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1em;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .refresh-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body onload="startAutoRefresh()">

  <div class="site-box departure-to-island">
    <h2>Färja 80 fr. Tranholmen</h2>
    <ul id="farja"></ul>
  </div>

  <div class="site-box departure-to-island">
    <h2>Buss 601 fr. Svanholmsvägen</h2>
    <ul id="buss"></ul>
  </div>

  <div class="site-box departure-to-island">
    <h2>Buss 50 fr. Lektorsstigen</h2>
    <ul id="lektorsstigen"></ul>
  </div>

  <div class="site-box departure-to-city">
    <h2>Färja 80 fr. Ropsten</h2>
    <ul id="ropsten"></ul>
  </div>

  <div class="site-box departure-to-city">
    <h2>Buss 601 fr. Danderyds sjukhus</h2>
    <ul id="ds"></ul>
  </div>

  <div class="site-box departure-to-city">
    <h2>Buss 50 fr. Odenplan</h2>
    <ul id="odenplan"></ul>
  </div>

  <p>Made with love from Tranholmen</p>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const svanholmsvagenSiteId = 2103;
    const tranholmenSiteId = 961;
    const lektorsstigenSiteId = 1180;

    async function fetchDepartures(siteId, transportMode, lineNumber, directionCode, forecast, elementId, destinationFilter = '') {
      const url = `https://transport.integration.sl.se/v1/sites/${siteId}/departures?forecast=${forecast}&direction=${directionCode}`;

      try {
        const res = await fetch(url);
        if (!res.ok) return;

        const data = await res.json();
        const departures = data.departures
          .filter(dep => dep.line && dep.line.transport_mode === transportMode && dep.line.designation === lineNumber && (!destinationFilter || dep.destination.includes(destinationFilter)))
          .slice(0, 5);

        const listElement = document.getElementById(elementId);
        listElement.innerHTML = '';

        if (departures.length === 0) {
          listElement.innerHTML = '<li>Inga avgångar hittades.</li>';
          return;
        }

        departures.forEach((dep, idx) => {
          const departureTime = new Date(dep.expected);
          const minutesLeft = Math.round((departureTime - new Date()) / 60000);
          const timeStr = departureTime.toLocaleTimeString('sv-SE', {hour: '2-digit', minute: '2-digit'});
          //const displayTime = minutesLeft <= 0 ? 'Nu' : `${timeStr} (${minutesLeft} min)`;
          const displayTime = dep.display;

          const li = document.createElement('li');
          if (idx === 0) li.classList.add('big');
          li.innerHTML = ` ${displayTime} → ${dep.destination}`;
          listElement.appendChild(li);
        });
      } catch (err) {
        console.error(err);
      }
    }

    function updateDepartures() {
      fetchDepartures(svanholmsvagenSiteId, 'BUS', '601', 2, 360, 'buss');
      fetchDepartures(tranholmenSiteId, 'SHIP', '80', 1, 360, 'farja', 'Ropsten');
      fetchDepartures(lektorsstigenSiteId, 'BUS', '50', 2, 360, 'lektorsstigen');
      fetchDepartures(9117, 'BUS', '50', 1, 360, 'odenplan');
      fetchDepartures(9201, 'BUS', '601', 1, 360, 'ds');
      fetchDepartures(9220, 'SHIP', '80', 1, 360, 'ropsten');
    }

    function startAutoRefresh() {
      updateDepartures();
      setInterval(updateDepartures, 30000);
    }

document.addEventListener("visibilitychange", function() {
  if (!document.hidden) {
    updateDepartures();
  }
});

  </script>

</body>
</html>
