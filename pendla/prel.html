
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Röstning om Rodden</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: auto; padding: 2em; }
    .stars { display: flex; flex-direction: row-reverse; justify-content: center; }
    .stars input { display: none; }
    .stars label {
      font-size: 2em;
      color: lightgray;
      cursor: pointer;
      transition: color 0.2s;
    }
    .stars input:checked ~ label,
    .stars label:hover,
    .stars label:hover ~ label {
      color: gold;
    }
  </style>
</head>
<body>

  <h2>Hur gick det att ro?</h2>

  <form action="https://docs.google.com/forms/d/e/FORM_ID/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true; alert('Tack för ditt svar!');">
    
    <div class="stars">
      <input type="radio" id="star5" name="entry.1234567890" value="5"><label for="star5">★</label>
      <input type="radio" id="star4" name="entry.1234567890" value="4"><label for="star4">★</label>
      <input type="radio" id="star3" name="entry.1234567890" value="3"><label for="star3">★</label>
      <input type="radio" id="star2" name="entry.1234567890" value="2"><label for="star2">★</label>
      <input type="radio" id="star1" name="entry.1234567890" value="1" required><label for="star1">★</label>
    </div>

    <label for="reason">Välj orsak:</label><br>
    <select name="entry.0987654321" id="reason" required>
      <option value="" disabled selected>-- Välj orsak --</option>
      <option value="Stark vind">Stark vind</option>
      <option value="Slut på båtar">Slut på båtar</option>
      <option value="Trasig båt">Trasig båt</option>
      <option value="Kärvande lås">Kärvande lås</option>
    </select><br><br>

    <button type="submit">Skicka</button>
  </form>

  <iframe name="hidden_iframe" style="display:none;"></iframe>

</body>
</html>
