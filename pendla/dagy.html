<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resor</title>
  <style>
    :root{
      /* Sofistikerad palett */
      --bg-start:#f7f8fb;
      --bg-end:#eef2f7;
      --card:#ffffffcc;
      --surface:#ffffff;
      --ink:#0b0f19;
      --muted:#6b7280;
      --border:rgba(12, 18, 28, .08);
      --ring:#7c93ff;
      --shadow:0 10px 30px rgba(19, 25, 39, .08);

      --primary-1:#4f46e5;   /* indigo */
      --primary-2:#0ea5e9;   /* cyan   */

      /* Trafikfärger – håll dem lugna */
      --walk:#22c55e;  /* grön */
      --bus:#f59e0b;   /* varm gul */
      --rail:#7c3aed;  /* lila, kvar om behövs i framtiden */
      --ferry:#06b6d4; /* turkos */

      --badge:rgba(125,133,166,.12);
      --hairline:rgba(12, 18, 28, .06);
    }

    /* Undvik layout-jumps vid font rendering */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji",
                   "Segoe UI Emoji";
      color:var(--ink);
      background:
        radial-gradient(1200px 800px at 10% -10%, #ffffff 0%, transparent 60%),
        radial-gradient(900px 600px at 100% 0%, #f4f6ff 0%, transparent 55%),
        linear-gradient(180deg, var(--bg-start), var(--bg-end));
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      letter-spacing:.01em;
    }

    .page{
      max-width:880px;
      padding:28px 20px 40px;
      margin:0 auto;
    }

    /* “Glass” kort/ytor */
    .panel{
      background:var(--card);
      backdrop-filter:saturate(150%) blur(8px);
      border:1px solid var(--hairline);
      border-radius:18px;
      box-shadow:var(--shadow);
    }

    /* Minimal toppbar */
    .toolbar{
      display:flex; gap:12px; align-items:center; flex-wrap:wrap;
      padding:14px; margin-bottom:14px;
    }
    .toolbar .title{
      font-size:1.05rem; font-weight:700; margin-right:auto; letter-spacing:.01em;
    }

    input, button{
      font-size:.92rem;
      border-radius:12px;
      transition:.2s ease;
    }
    input{
      padding:10px 12px;
      border:1px solid var(--border);
      background:linear-gradient(180deg,#fff, #fbfcff);
      box-shadow:inset 0 1px 0 #ffffffcc;
      color:var(--ink);
      outline:none;
    }
    input:focus{
      border-color:var(--ring);
      box-shadow:0 0 0 4px color-mix(in srgb, var(--ring) 18%, transparent);
    }

    button{
      padding:10px 14px;
      border:0;
      color:#fff;
      font-weight:700;
      background:
        linear-gradient(135deg, var(--primary-1), var(--primary-2));
      box-shadow:0 6px 16px rgba(14,165,233,.18), inset 0 1px 0 rgba(255,255,255,.18);
      transform:translateY(0);
      will-change:transform, box-shadow;
      cursor:pointer;
    }
    @media (hover:hover){
      button:hover{ transform:translateY(-1px); box-shadow:0 10px 24px rgba(14,165,233,.24); }
    }
    button:active{ transform:translateY(0); box-shadow:0 6px 16px rgba(14,165,233,.18); }
    button:disabled{ opacity:.6; cursor:not-allowed; }

    /* Reselista – “elevated minimal” */
    .journey{
      border:1px solid var(--hairline);
      border-radius:16px;
      margin:10px 0;
      background:linear-gradient(180deg, #fff, #fbfcff);
      overflow:hidden;
      font-size:.92rem;
      box-shadow:0 1px 0 #ffffff, var(--shadow);
      transition:box-shadow .2s ease, transform .2s ease;
    }
    @media (hover:hover){
      .journey:hover{ transform:translateY(-1px); box-shadow:0 1px 0 #ffffff, 0 12px 28px rgba(19,25,39,.10); }
    }

    .summary-row{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:14px 16px; cursor:pointer; user-select:none;
    }
    .summary-left{ display:flex; gap:12px; align-items:center; font-weight:700; flex-shrink:0 }
    .pill{
      display:inline-flex; gap:8px; align-items:center;
      padding:6px 10px;
      border-radius:999px;
      background:linear-gradient(180deg, #f9faff, #eef2ff);
      border:1px solid var(--hairline);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:.9rem;
      color:#1f2937;
      font-variant-numeric: tabular-nums;
    }
    .duration{ font-size:.9rem; color:#374151 }
    .lines{
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color:#3b4254;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      font-size:.9rem; flex-grow:1; text-align:right;
    }
    .chev{ margin-left:6px; transition: transform .18s ease; flex-shrink:0; opacity:.7 }
    .journey.open .chev{ transform: rotate(90deg); opacity:1 }

    .divider{ height:1px; background:var(--hairline) }

    .details{ display:none; padding:8px 16px 14px }
    .journey.open .details{ display:block }

    /* Detaljben – renare, med ikonchips */
    .legs{ margin-top:6px; }
    .leg{
      display:grid; grid-template-columns: 28px 1fr; gap:12px;
      padding:10px 0; border-top:1px dashed var(--hairline);
      font-size:.9rem;
    }
    .leg:first-child{ border-top:0 }
    .icon{
      width:28px; height:28px; border-radius:9px;
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:1rem;
      background:linear-gradient(180deg,#cbd5e1,#94a3b8);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.28);
    }
    .icon.bus   { background:linear-gradient(180deg, #ffd37a, #f59e0b); }
    .icon.walk  { background:linear-gradient(180deg, #b7f7cd, #22c55e); }
    .icon.rail  { background:linear-gradient(180deg, #d7c0ff, #7c3aed); }
    .icon.ferry { background:linear-gradient(180deg, #b9f3ff, #06b6d4); }

    .leg-title{ font-weight:700; letter-spacing:.01em }
    .leg-sub{ font-size:.86rem; color:var(--muted); line-height:1.4 }
    .chip{
      display:inline-block; padding:2px 8px; border-radius:999px;
      background:var(--badge); margin-left:6px; font-size:.78rem;
      border:1px solid var(--hairline);
    }

    /* Hjälptext tom-lista */
    .empty{
      padding:18px;
      border-radius:14px;
      background:linear-gradient(180deg, #fff, #fbfcff);
      border:1px dashed var(--hairline);
      color:var(--muted);
      text-align:center;
    }

    /* Fokus-synlighet för tangentbord */
    .summary-row:focus-visible, button:focus-visible, input:focus-visible{
      outline:none;
      box-shadow:0 0 0 4px color-mix(in srgb, var(--ring) 20%, transparent);
      border-radius:14px;
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- Top toolbar i ett glas-kort -->
    <div class="panel toolbar">
      <div class="title">Resor</div>
      <button id="swapBtn" type="button">Svanholmsvägen → Danderyds gymnasium</button>
      <input id="dt" type="datetime-local" />
      <button id="btn">Hämta resor</button>
    </div>

    <!-- Resultat -->
    <div id="out"></div>
  </div>

  <script>
    // === Konstanter ===
    const STOPS = {
      SVAN: { id: "9091001000002103", name: "Svanholmsvägen" },
      DGY:  { id: "9091001000002125", name: "Danderyds gymnasium" }
    };
    const BASE = "https://journeyplanner.integration.sl.se/v2/trips";
    const TZ   = "Europe/Stockholm";
    const MAX_CHANGES = 3, MAX_BATCHES = 3, TRIPS_PER_CALL = 3;
    let svanToDgy = true;

    // === Tid/format ===
    const svTime = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, hour:'2-digit', minute:'2-digit' });
    const pad = n => String(n).padStart(2,'0');
    const toTZ = d => new Date(d.toLocaleString('en-US',{timeZone:TZ}));
    function nowMinus(min=5){const d=toTZ(new Date());d.setMinutes(d.getMinutes()-min);d.setSeconds(0,0);return d;}
    function yyyymmdd(d){return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;}
    function hhmm(d){return `${pad(d.getHours())}${pad(d.getMinutes())}`;}
    const fmtTime = d=>svTime.format(d);

    // Rensa platsnamn: ta bort ", …"
    const cleanName = s => String(s||'').replace(/,.*$/,'').trim();

    // === UI helpers ===
    function clearResults(){ document.getElementById('out').innerHTML = ''; }
    function updateSwapBtn(){
      document.getElementById('swapBtn').textContent = svanToDgy
        ? 'Svanholmsvägen → Danderyds gymnasium'
        : 'Danderyds gymnasium → Svanholmsvägen';
    }

    // === API URL ===
    function buildTripsUrl(originId, destId, dateStr, timeStr){
      const p=new URLSearchParams({
        type_origin:'any',name_origin:originId,
        type_destination:'any',name_destination:destId,
        incl_mot_5:'true',max_changes:String(MAX_CHANGES),
        route_type:'leasttime',calc_number_of_trips:String(TRIPS_PER_CALL),
        language:'sv',itd_date:dateStr,itd_time:timeStr,calc_one_direction:'true'
      });
      return BASE+'?'+p.toString();
    }

    // === Parser ===
    function parseFlex(s){
      if(!s) return null;
      const d=new Date(s); if(!isNaN(d)) return d;
      const digits=String(s).replace(/\D+/g,'');
      if(digits.length>=12){
        const y=digits.slice(0,4),mo=digits.slice(4,6),da=digits.slice(6,8);
        const hh=digits.slice(8,10),mm=digits.slice(10,12),ss=digits.slice(12,14)||'00';
        const d2=new Date(`${y}-${mo}-${da}T${hh}:${mm}:${ss}`);
        return isNaN(d2)?null:d2;
      }
      return null;
    }
    const firstOf=(o,ks)=>ks.find(k=>o?.[k]!=null)?o[ks.find(k=>o?.[k]!=null)]:null;
    function depFromLeg(l){
      return firstOf(l?.origin||{},[
        'departureTimeEstimated','departureTimePlanned','departureTimeBaseTimetable',
        'rtDateTime','dateTime','dateTimePlanned','plannedDateTime','rtTime','time'
      ]) || firstOf(l||{},['rtDepartureTime','plannedDepartureTime','departure','depTime'])
        || firstOf(l?.destination||{},['rtDateTime','dateTime','plannedDateTime','rtTime','time']);
    }
    function arrFromLeg(l){
      return firstOf(l?.destination||{},[
        'arrivalTimeEstimated','arrivalTimePlanned','arrivalTimeBaseTimetable',
        'rtDateTime','dateTime','dateTimePlanned','plannedDateTime','rtTime','time','arrDateTime'
      ]) || firstOf(l||{},['rtArrivalTime','plannedArrivalTime','arrival','arrTime'])
        || firstOf(l?.origin||{},['rtDateTime','dateTime','plannedDateTime','rtTime','time']);
    }
    const legKind = l => (String(l?.transportMode||'').toUpperCase().includes('WALK') || (!l?.transportation && l?.footPathInfo?.length)) ? 'walk' : 'vehicle';
    const minutes = sec => Math.round((sec||0)/60);

    // === Linjelista för kompakt rad ===
    function extractLineLabel(l){
      const t = l.transportation || {};
      return t.disassembledName || t.number || t.name || l.product?.name || null;
    }
    function collectBusLines(legs){
      const lines = [];
      for (const l of legs){
        if (legKind(l) === 'vehicle'){
          const label = extractLineLabel(l);
          if (label) lines.push(String(label).trim());
        }
      }
      const cleaned = lines.map(s => (s.match(/(\d+[A-Za-z]?)/) || [null, s])[1]);
      return [...new Set(cleaned)];
    }

    // === Rendering ===
    function renderJourneyCards(list){
      const host=document.getElementById('out');
      if(!list.length){
        host.innerHTML='<div class="panel empty">Inga resor hittades.</div>';
        return;
      }
      host.innerHTML=list.map(renderJourneyEntry).join('');
      host.querySelectorAll('.summary-row').forEach(row=>{
        row.addEventListener('click',function(){
          const box=this.parentNode;box.classList.toggle('open');
          this.setAttribute('aria-expanded', box.classList.contains('open') ? 'true' : 'false');
        });
      });
    }

    function renderJourneyEntry(j){
      const legs=j.legs||[];
      const dep=parseFlex(depFromLeg(legs[0]||{}));
      const arr=parseFlex(arrFromLeg(legs[legs.length-1]||{}));
      const depHM=fmtTime(dep), arrHM=fmtTime(arr);
      const dur=minutes(j.tripRtDuration??j.tripDuration);
      const lineStr=collectBusLines(legs).join(' · ');
      return `
        <div class="journey">
          <div class="summary-row" role="button" aria-expanded="false" tabindex="0">
            <div class="summary-left">
              <span class="pill">${depHM} → ${arrHM}</span>
              <span class="duration">${dur} min</span>
            </div>
            <div class="lines">${lineStr ? '🚌 ' + lineStr : ''}</div>
            <div class="chev">▸</div>
          </div>
          <div class="divider"></div>
          <div class="details">
            <div class="legs">
              ${legs.map(renderLeg).join('')}
            </div>
          </div>
        </div>`;
    }

    function renderLeg(l){
      const kind=legKind(l);
      const depT=fmtTime(parseFlex(depFromLeg(l)));
      const arrT=fmtTime(parseFlex(arrFromLeg(l)));

      if(kind==='walk'){
        const f = l.footPathInfo?.[0]?.footPathElem?.[0];
        const dist = f?.attributes?.distance ? `${f.attributes.distance} m` : '';
        const durS = l.duration ? `${minutes(l.duration)} min` : '';
        const extra = [dist, durS].filter(Boolean).join(' · ');
        const from = cleanName(l.origin?.name||'');
        const to   = cleanName(l.destination?.name||'');
        return `
          <div class="leg">
            <div class="icon walk">🚶</div>
            <div>
              <div class="leg-title">Gång ${extra?`<span class="chip">${extra}</span>`:''}</div>
              <div class="leg-sub">
                ${from?`På: ${from} ${depT}`:''}
                ${to?`<br>Av: ${to} ${arrT}`:''}
              </div>
            </div>
          </div>`;
      }

      // vehicle: visa linje, riktning, på/av på separata rader
      const t=l.transportation||{};
      const line = extractLineLabel(l) || 'Linje';
      const direction = cleanName(t.destination?.name || l.destination?.parent?.name || l.destination?.name || '');
      const from = cleanName(l.origin?.name||'');
      const to   = cleanName(l.destination?.name||'');

      return `
        <div class="leg">
          <div class="icon bus">🚌</div>
          <div>
            <div class="leg-title">${line}${direction?` → ${direction}`:''}</div>
            <div class="leg-sub">
              På: ${from} ${depT}<br>
              Av: ${to} ${arrT}
            </div>
          </div>
        </div>`;
    }

    // === Hämtning ===
    async function fetchTrips(){
      const from=svanToDgy?STOPS.SVAN:STOPS.DGY;
      const to=svanToDgy?STOPS.DGY:STOPS.SVAN;
      const dtInput=document.getElementById('dt').value;
      let cursor=dtInput?new Date(dtInput):nowMinus(5);cursor.setSeconds(0,0);

      const btn=document.getElementById('btn');btn.disabled=true;btn.textContent='Hämtar…';
      const all=[],seen=new Set();

      try{
        for(let b=0;b<MAX_BATCHES;b++){
          const url=buildTripsUrl(from.id,to.id,yyyymmdd(cursor),hhmm(cursor));
          const res=await fetch(url,{headers:{'Accept':'application/json'}});
          const data=await res.json();
          const journeys=data?.journeys||[];
          let latestDep=null;

          for(const j of journeys){
            const legs=j.legs||[]; if(!legs.length) continue;
            const dep=parseFlex(depFromLeg(legs[0]));
            const arr=parseFlex(arrFromLeg(legs[legs.length-1]));
            const key=`${dep?.toISOString()||''}_${arr?.toISOString()||''}_${(j.tripRtDuration||j.tripDuration)||0}`;
            if(dep && !seen.has(key)){ seen.add(key); all.push(j); }
            if(dep && (!latestDep || dep>latestDep)) latestDep=dep;
          }
          cursor = latestDep && latestDep > cursor ? new Date(latestDep.getTime()+60000) : new Date(cursor.getTime()+60000);
        }
      } catch(_) { /* tyst */ }
      btn.disabled=false;btn.textContent='Hämta resor';

      all.sort((a,b)=>parseFlex(depFromLeg(a.legs?.[0]||{})) - parseFlex(depFromLeg(b.legs?.[0]||{})));
      renderJourneyCards(all);
    }

    // === Init & events ===
    function setDefaultDatetime(){
      const d=nowMinus(5);
      const val=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      document.getElementById('dt').value=val;
    }
    document.getElementById('btn').addEventListener('click',fetchTrips);
    document.getElementById('swapBtn').addEventListener('click',()=>{svanToDgy=!svanToDgy;updateSwapBtn();clearResults();});
    document.getElementById('dt').addEventListener('change',()=>{clearResults();});
    function updateSwapBtn(){
      document.getElementById('swapBtn').textContent=
        svanToDgy?'Svanholmsvägen → Danderyds gymnasium':'Danderyds gymnasium → Svanholmsvägen';
    }
    setDefaultDatetime();updateSwapBtn();
  </script>
</body>
</html>
