<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nästa avgångar - Tranholmen</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#cfe8ff">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #e3f2fd 0%, #90caf9 40%, #42a5f5 200%);
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }

    .menu {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100;
    }

    .menu-button {
      background: #444;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .menu-content {
      display: none;
      position: absolute;
      right: 0;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      padding: 10px;
    }

    .menu-content button {
      display: block;
      margin-bottom: 5px;
      width: 100%;
      padding: 8px;
    }

    .site-box {
      width: 90%;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .departure-to-city {
      background-color: rgba(255, 200, 220, 0.8);
    }

    .departure-to-island {
      background-color: rgba(200, 230, 200, 0.8);
    }
  </style>
</head>
<body>

  <div class="menu">
    <button class="menu-button" onclick="toggleMenu()">☰</button>
    <div class="menu-content" id="menuContent">
      <button onclick="showInstallInstructions()">Lägg till på hemskärmen</button>
      <button onclick="showAbout()">About</button>
    </div>
  </div>

  <div class="site-box departure-to-island">
    <h2>Pendelfärja 80 från Tranholmen</h2>
    <ul id="farja"></ul>
  </div>

  <div class="site-box departure-to-island">
    <h2>Buss 601 från Svanholmsvägen</h2>
    <ul id="buss"></ul>
  </div>

  <div class="site-box departure-to-island">
    <h2>Buss 50 från Lektorsstigen</h2>
    <ul id="lektorsstigen"></ul>
  </div>

  <div class="site-box departure-to-city">
    <h2>Pendelfärja 80 från Ropsten</h2>
    <ul id="ropsten"></ul>
  </div>

  <div class="site-box departure-to-city">
    <h2>Buss 601 från Danderyds sjukhus</h2>
    <ul id="ds"></ul>
  </div>

  <div class="site-box departure-to-city">
    <h2>Buss 50 från Odenplan</h2>
    <ul id="odenplan"></ul>
  </div>

  <div style="text-align: center; font-size: 0.8em; margin-top: 20px;">
    <a href="#" onclick="showInstallInstructions()" style="font-size: 0.7em; text-decoration: none; color: #666;">Lägg till på hemskärmen</a> | 
    <a href="#" onclick="showAbout()" style="font-size: 0.7em; text-decoration: none; color: #666;">Om appen</a>
  </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('menuContent');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function showInstallInstructions() {
      alert("För att lägga till appen på hemskärmen:\n\n" +
            "På iOS (Safari): Tryck på dela-ikonen och välj 'Lägg till på hemskärmen'.\n\n" +
            "På Android (Chrome): Tryck på menyknappen och välj 'Lägg till på hemskärmen'.");
    }

    function showAbout() {
      alert("Made with love from Tranholmen");
    }
  </script>
</body>
</html>
