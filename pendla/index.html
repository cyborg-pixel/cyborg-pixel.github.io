<script>
  const STORAGE_KEY = 'unique_visitor_id';

function generateClientId() {
  const timestamp = new Date().toISOString(); // ex: 2025-05-10T14:03:00.000Z
  const uuid = crypto.randomUUID();           // ex: 0f2d4ae2-...
  return `${timestamp}_${uuid}`;
}

function getClientId() {
  let id = localStorage.getItem(STORAGE_KEY);
  if (!id) {
    id = generateClientId();
    localStorage.setItem(STORAGE_KEY, id);
  }
  return id;
}


async function registerVisit() {
  const clientId = getClientId();
  const url = `https://papi.pandulus.workers.dev/register?client_id=${encodeURIComponent(clientId)}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    console.log("Svar från Worker:", text);
  } catch (err) {
    console.error("Fel vid kontakt med räknare:", err);
  }
}

registerVisit();
<!-- END Räkna unika besökare -->

      function getWeekNumber(date) {
        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
      }

      function getBarnacleRisk(week) {
        const ranges = [
          { from: 1, to: 22, level: "<span style='color:black'>låg</span>" },
          { from: 23, to: 26, level: "<span style='color:brown'>medel</span>" },
          { from: 27, to: 35, level: "<span style='color:red'>hög</span>" },
          { from: 36, to: 38, level: "<span style='color:brown'>medel</span>" },
          { from: 39, to: 52, level: "<span style='color:black'>låg</span>" }
        ];
        const r = ranges.find(r => week >= r.from && week <= r.to);
        return r ? r.level : "❓";
      }

      const waterLevelConfig = {
        thresholds: [-6.8, 5.4, 21.3, 34.5],
        colors: ['red', 'brown', 'black', 'brown', 'red']
      };

function getWaterLevelBlock(value) {
  const percentiles = [-4.7, 3.0, 8.4, 13.2, 18.3, 23.5, 31.8];
  const blocks     = ['▁','▂','▃','▄','▅','▆','▇','█'];
  const color      = '#0077be';
  const bcolor      = '#AAAAAA';
  let level = 0;
  for (let i = 0; i < percentiles.length; i++) {
    if (value >= percentiles[i]) level = i + 1;
    else break;
  }
  return `<span style="
    display:inline-block;
    width:1.2ch;
    height:1.2em;
    line-height:1em;
    text-align:center;
    border:1px solid ${bcolor};
    box-sizing:border-box;
    color:${color};
    font-family:monospace;
  ">${blocks[level]}</span>`;
}


      function getWaterLevelColor(value) {
        for (let i = 0; i < waterLevelConfig.thresholds.length; i++) {
          if (value <= waterLevelConfig.thresholds[i]) {
            return waterLevelConfig.colors[i];
          }
        }
        return waterLevelConfig.colors[waterLevelConfig.colors.length - 1];
      }

      async function displayOcean(data) {
        const ts = data.properties.timeseries[0];
        const d = ts.data.instant.details;
        const temp = d.sea_water_temperature ?? "?";
        const wave = d.sea_surface_wave_height != null
          ? Math.round(d.sea_surface_wave_height * 100) + " cm"
          : "?";
        
        const levelValue = await fetchWaterLevel();
        let levelHTML;
        if (levelValue === null) {
          levelHTML = `<span>⚠️ Vattenstånd ej tillgängligt</span>`;
        } else {
          const rounded = Math.round(levelValue) + " cm";
          levelHTML     = `${getWaterLevelBlock(levelValue)} ${rounded}`;
        }
        
        const week = getWeekNumber(new Date());
        const tulpan = getBarnacleRisk(week);
        document.getElementById("ocean-summary").innerHTML =
          `${temp}°C, 🌊${wave}, ${levelHTML}, 🐚 risk: ${tulpan}`;
      }

  function updateSchoolFerryContent() {
    const prefs = loadPreferences();
    if (prefs.schoolferry === false) return;
    const now = new Date();
    const startDate = new Date(schoolFerryConfig.startDate);
    const endDate = new Date(schoolFerryConfig.endDate);
    const isActivePeriod = now >= startDate && now <= endDate;
    const ul = document.getElementById("schoolferry-list");
    if (!ul) return;
    ul.innerHTML = "";
    const futureTrips = schoolFerryTrips
      .map(trip => {
        const [h, m] = trip.departure.split(":").map(Number);
        const dep = new Date(now);
        dep.setHours(h, m, 0, 0);
        if (dep < now) dep.setDate(dep.getDate() + 1);
        return { ...trip, depDate: dep };
      })
      .filter(trip => {
        const diffMin = (trip.depDate - now) / 60000;
        const weekday = trip.depDate.getDay();
        return (
          diffMin >= 0 &&
          diffMin <= 1440 &&
          weekday >= 1 &&
          weekday <= 5 &&
          !isRedDay(trip.depDate)
        );
      })
      .sort((a, b) => a.depDate - b.depDate)
      .slice(0, 4);

    if (futureTrips.length === 0) {
      ul.innerHTML = "<li>Inga avgångar hittades.</li>";
    } else {
      futureTrips.forEach((trip, idx) => {
        const diffMs = trip.depDate - now;
        const mins = Math.floor(diffMs / 60000);
        let displayText;
        if (mins < 1) {
          displayText = "Nu";
        } else if (mins <= 30) {
          displayText = `${mins} min`;
        } else {
          displayText = trip.departure; // hh:mm
        }
        const li = document.createElement("li");
        if (idx === 0) li.classList.add("big");
        if (!isActivePeriod) li.classList.add("strikethrough");
        // Använd innerHTML för att kunna infoga span
        li.innerHTML = `
          <span class="ferry-time">${displayText}</span>
          ${trip.from} &rarr; ${trip.to}
        `.trim();
        ul.appendChild(li);
      });
    }
  }

              ">

      </div>
      <ul id="poolboat-content">
        <li>Laddar...</li>
      </ul>
    `;
    container.appendChild(box);

    // Toggle-logik
    if (hasCode) {
      const span       = box.querySelector("#poolboat-code-dots");
      let   timeoutId  = null;

      span.addEventListener("click", () => {
        // Om vi redan visar koden → göm
        if (span.textContent === code) {
          clearTimeout(timeoutId);
          span.textContent = dots;
        } else {
          // Annars visa koden
          span.textContent = code;
          timeoutId = setTimeout(() => {
            span.textContent = dots;
          }, 15000);
        }
      });
    }
  }

  updatePoolBoatWidget();
}

        const prefs = loadPreferences();
        updateSlWidgets();
        updateSchoolFerryContent();
        updatePoolBoatWidget();
        if (prefs.ocean) fetchOcean();
        const now = new Date();
        const hh = now.getHours().toString().padStart(2, "0");
        const mm = now.getMinutes().toString().padStart(2, "0");
        document.getElementById("last-updated").textContent =
          `Senast uppdaterad: ${hh}:${mm}`;
      }

      function reloadWeatherScript() {
        const oldScript = document.querySelector("script[data-weather]");
        if (oldScript) oldScript.remove();
        const script = document.createElement("script");
        script.src = "weather.js";
        script.defer = true;
        script.setAttribute("data-weather", "true");
        document.body.appendChild(script);
      }

 function startAutoRefresh() {
    renderAllWidgets();
    updateAllWidgets();
  // Bara om väder-widgeten syns
  const prefs = loadPreferences();
  if (prefs.weather) reloadWeatherScript();
    if (autoRefreshTimer !== null) {
      clearInterval(autoRefreshTimer);
    }
    // Generell uppdatering var 2 min
    autoRefreshTimer = setInterval(updateAllWidgets, 120000);
    // Endast skolfärjan uppdateras var 10:e sekund
    setInterval(updateSchoolFerryContent, 10000);
  }

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) updateSlWidgets();
      });

      function toggleConfig(show) {
        document.getElementById("main-view").classList.toggle("hidden", show);
        document.getElementById("config-view").classList.toggle("hidden", !show);
        if (show) {
          renderConfig();
        } else {
          startAutoRefresh();
        }
      }

      function renderConfig() {
        const prefs = loadPreferences();
        const config = document.getElementById("config-view");
        config.innerHTML = "<h2>Välj info som ska visas</h2>";
        const form = document.createElement("form");
        
        widgets.forEach(widget => {
          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.name = widget.id;
          checkbox.checked = prefs[widget.id] !== false;
          label.appendChild(checkbox);
          label.append(` ${widget.title}`);
          form.appendChild(label);
          form.appendChild(document.createElement("br"));
        });



        // --- Ny rubrik för övriga inställningar ---
        const otherHeader = document.createElement("h2");
        otherHeader.textContent = "Övriga inställningar";
        otherHeader.style.marginTop = "20px"; 
        form.appendChild(otherHeader);

        // --- Endast om poolbåtens widget är ikryssad ---
          const labelCode = document.createElement("label");
          labelCode.textContent = "Koden till poolbåtarna: ";
          const inputCode = document.createElement("input");
          inputCode.type = "text";
          inputCode.name = "poolboatCode";
          inputCode.maxLength = 14;
          // Förifyll med tidigare sparad kod eller tomt
          inputCode.value = localStorage.getItem("poolboatCode") || "";
          labelCode.appendChild(inputCode);
          form.appendChild(labelCode);
          form.appendChild(document.createElement("br"));



// --- Dela appen-sektion ---
const shareHeader = document.createElement("h2");
shareHeader.textContent = "Dela appen";
shareHeader.style.marginTop = "20px";
form.appendChild(shareHeader);

// Länk till appen
const shareLink = document.createElement("div");
shareLink.innerHTML = `<a href="https://cyborg-pixel.github.io/pendla/" target="_blank">
  https://cyborg-pixel.github.io/pendla/
</a>`;
form.appendChild(shareLink);

// QR-kod
const qr = document.createElement("img");
qr.src = "qr_out.png";
qr.alt = "QR-kod för att dela appen";
qr.style.display = "block";
qr.style.width = "30%";      // 30% av konfigurationssektionens bredd
qr.style.marginTop = "10px";
form.appendChild(qr);
form.appendChild(document.createElement("br"));


          

        const saveBtn = document.createElement("button");
        saveBtn.textContent = "Spara";
        saveBtn.type = "submit";
        saveBtn.className = "refresh-button";
        form.appendChild(saveBtn);

        form.onsubmit = e => {
          e.preventDefault();

          // Spara widget-inställningarna som tidigare
          const newPrefs = {};
          widgets.forEach(widget => {
            newPrefs[widget.id] = form.elements[widget.id].checked;
        });
        savePreferences(newPrefs);

        // Spara poolbåts-koden
        const codeInput = form.elements.poolboatCode;
        if (codeInput) {
          const code = codeInput.value.trim();
          localStorage.setItem("poolboatCode", code);
        }

        toggleConfig(false);
      };


      config.appendChild(form);
      }
    </script>
  </body>
</html>
