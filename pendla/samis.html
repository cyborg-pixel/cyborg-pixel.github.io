<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resor</title>
  <style>
    :root{
      /* Sofistikerad palett */
      --bg-start:#f7f8fb;
      --bg-end:#eef2f7;
      --card:#ffffffcc;
      --surface:#ffffff;
      --ink:#0b0f19;
      --muted:#6b7280;
      --border:rgba(12,18,28,.08);
      --hairline:rgba(12,18,28,.06);
      --ring:#7c93ff;
      --shadow:0 10px 30px rgba(19,25,39,.08);

      --primary-1:#4f46e5;
      --primary-2:#0ea5e9;

      --bus:#f59e0b;
      --metro:#111827;
      --tram:#7c3aed;
      --rail:#0ea5e9;
      --ferry:#06b6d4;
      --walk:#22c55e;

      --badge:rgba(125,133,166,.12);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji",
                   "Segoe UI Emoji";
      color:var(--ink);
      background:
        radial-gradient(1200px 800px at 10% -10%, #ffffff 0%, transparent 60%),
        radial-gradient(900px 600px at 100% 0%, #f4f6ff 0%, transparent 55%),
        linear-gradient(180deg, var(--bg-start), var(--bg-end));
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      letter-spacing:.01em;
    }

    .page{ max-width:880px; padding:28px 20px 40px; margin:0 auto; }

    /* Glassy panel */
    .panel{
      background:var(--card);
      backdrop-filter:saturate(150%) blur(8px);
      border:1px solid var(--hairline);
      border-radius:18px;
      box-shadow:var(--shadow);
    }

    /* Toolbar */
    .toolbar{
      display:flex; gap:12px; align-items:center; flex-wrap:wrap;
      padding:14px; margin-bottom:14px;
    }
    .toolbar .title{ font-size:1.05rem; font-weight:700; margin-right:auto; letter-spacing:.01em; }

    input, button{ font-size:.92rem; border-radius:12px; transition:.2s ease; }
    input{
      padding:10px 12px;
      border:1px solid var(--border);
      background:linear-gradient(180deg,#fff,#fbfcff);
      box-shadow:inset 0 1px 0 #ffffffcc;
      color:var(--ink);
      outline:none;
    }
    input:focus{
      border-color:var(--ring);
      box-shadow:0 0 0 4px color-mix(in srgb, var(--ring) 18%, transparent);
    }
    button{
      padding:10px 14px; border:0; color:#fff; font-weight:700;
      background:linear-gradient(135deg, var(--primary-1), var(--primary-2));
      box-shadow:0 6px 16px rgba(14,165,233,.18), inset 0 1px 0 rgba(255,255,255,.18);
      transform:translateY(0); will-change:transform, box-shadow; cursor:pointer;
    }
    @media (hover:hover){
      button:hover{ transform:translateY(-1px); box-shadow:0 10px 24px rgba(14,165,233,.24); }
    }
    button:active{ transform:translateY(0); box-shadow:0 6px 16px rgba(14,165,233,.18); }
    button:disabled{ opacity:.6; cursor:not-allowed; }

    /* Resekort */
    .journey{
      border:1px solid var(--hairline);
      border-radius:16px;
      margin:10px 0;
      background:linear-gradient(180deg,#fff,#fbfcff);
      overflow:hidden;
      font-size:.92rem;
      box-shadow:0 1px 0 #ffffff, var(--shadow);
      transition:box-shadow .2s ease, transform .2s ease;
    }
    @media (hover:hover){
      .journey:hover{ transform:translateY(-1px); box-shadow:0 1px 0 #ffffff, 0 12px 28px rgba(19,25,39,.10); }
    }

    .summary-row{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:14px 16px; cursor:pointer; user-select:none;
    }
    .summary-left{ display:flex; gap:12px; align-items:center; font-weight:700; flex-shrink:0 }
    .pill{
      display:inline-flex; gap:8px; align-items:center; padding:6px 10px;
      border-radius:999px; background:linear-gradient(180deg,#f9faff,#eef2ff);
      border:1px solid var(--hairline);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:.9rem; color:#1f2937; font-variant-numeric:tabular-nums;
    }
    .duration{ font-size:.9rem; color:#374151 }
    .lines{
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color:#3b4254; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      font-size:.9rem; flex-grow:1; text-align:right;
    }
    .chev{ margin-left:6px; transition:transform .18s ease; flex-shrink:0; opacity:.7 }
    .journey.open .chev{ transform:rotate(90deg); opacity:1 }

    .divider{ height:1px; background:var(--hairline) }
    .details{ display:none; padding:8px 16px 14px }
    .journey.open .details{ display:block }

    /* Benvisning */
    .legs{ margin-top:6px; }
    .leg{
      display:grid; grid-template-columns:28px 1fr; gap:12px;
      padding:10px 0; border-top:1px dashed var(--hairline); font-size:.9rem;
    }
    .leg:first-child{ border-top:0 }
    .icon{
      width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:1rem; background:linear-gradient(180deg,#cbd5e1,#94a3b8);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.28);
    }
    .bus   { background:linear-gradient(180deg,#ffd37a,#f59e0b); }
    .metro { background:linear-gradient(180deg,#bfc5cd,#111827); }
    .tram  { background:linear-gradient(180deg,#d7c0ff,#7c3aed); }
    .rail  { background:linear-gradient(180deg,#c5ebff,#0ea5e9); }
    .ferry { background:linear-gradient(180deg,#b9f3ff,#06b6d4); }
    .walk  { background:linear-gradient(180deg,#b7f7cd,#22c55e); }

    .leg-title{ font-weight:700; letter-spacing:.01em }
    .leg-sub{ font-size:.86rem; color:var(--muted); line-height:1.4 }
    .chip{
      display:inline-block; padding:2px 8px; border-radius:999px;
      background:var(--badge); margin-left:6px; font-size:.78rem;
      border:1px solid var(--hairline);
    }

    /* Debugpanel */
    .debug{
      margin-top:14px; padding:14px; display:none;
      background:var(--card); border:1px dashed var(--hairline);
      border-radius:14px; box-shadow:var(--shadow);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:.86rem; color:#1f2937;
    }
    .debug pre{ white-space:pre-wrap; word-break:break-word; margin:6px 0 }

    /* Tom-lista */
    .empty{
      padding:18px; border-radius:14px;
      background:linear-gradient(180deg,#fff,#fbfcff);
      border:1px dashed var(--hairline); color:var(--muted); text-align:center;
    }

    /* Fokus-synlighet */
    .summary-row:focus-visible, button:focus-visible, input:focus-visible{
      outline:none; box-shadow:0 0 0 4px color-mix(in srgb, var(--ring) 20%, transparent);
      border-radius:14px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="panel toolbar">
      <div class="title">Resor</div>
      <button id="swapBtn" type="button">Tranholmen → VR samskola</button>
      <input id="dt" type="datetime-local" />
      <button id="btn">Hämta resor</button>
      <button id="dbgToggle" type="button" style="background:linear-gradient(135deg,#475569,#64748b)">Debug</button>
    </div>

    <div id="out"></div>
    <div id="debug" class="debug"></div>
  </div>

  <script>
    /* ===== Koordinater ===== */
    function toSLCoord(lat, lon){
      const fix = n => Number(n).toFixed(6);
      return `${fix(lon)}:${fix(lat)}:WGS84[dd.ddddd]`;
    }
    const ORIG = { id: toSLCoord(59.37560952758223, 18.088214567991976), name: "Tranholmen" };
    const DEST = { id: toSLCoord(59.402731530255174, 18.0825747819761), name: "VR samskola" };
    let forward = true;

    /* ===== Tid ===== */
    const TZ="Europe/Stockholm";
    const pad=n=>String(n).padStart(2,'0');
    const toTZ=d=>new Date(d.toLocaleString('en-US',{timeZone:TZ}));
    function nowMinus(min=5){ const d=toTZ(new Date()); d.setMinutes(d.getMinutes()-min); d.setSeconds(0,0); return d; }
    function yyyymmdd(d){ return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`; }
    function hhmm(d){ return `${pad(d.getHours())}${pad(d.getMinutes())}`; }
    const fmtTime = d => new Intl.DateTimeFormat('sv-SE',{ timeZone:TZ, hour:'2-digit', minute:'2-digit' }).format(d);

    /* ===== UI helpers ===== */
    function clearResults(){ document.getElementById('out').innerHTML=''; }
    function updateSwapBtn(){ document.getElementById('swapBtn').textContent = forward ? 'Tranholmen → VR samskola' : 'VR samskola → Tranholmen'; }
    const cleanName = s => String(s||'').replace(/,.*$/,'').trim();

    /* ===== Debug ===== */
    let dbgOn=false; const dbgHost=document.getElementById('debug');
    document.getElementById('dbgToggle').addEventListener('click',()=>{ dbgOn=!dbgOn; dbgHost.style.display=dbgOn?'block':'none'; });
    function dbg(msg){ if(!dbgOn) return; const t=new Date().toLocaleTimeString('sv-SE'); dbgHost.innerHTML+=`<div><span style="color:var(--muted)">${t}</span> — ${msg}</div>`; }
    function dbgPre(title,obj){ if(!dbgOn) return; const s=typeof obj==='string'?obj:JSON.stringify(obj,null,2); dbgHost.innerHTML+=`<div><strong>${title}</strong><pre>${s.slice(0,4000)}</pre></div>`; }

    /* ===== API-url ===== */
    const BASE="https://journeyplanner.integration.sl.se/v2/trips";
    const MAX_BATCHES=4, TRIPS_PER_CALL=3, MAX_CHANGES=3;
    function buildUrl(from, to, dateStr, timeStr){
      const p=new URLSearchParams({
        type_origin:'coord', name_origin: from.id,
        type_destination:'coord', name_destination: to.id,
        route_type:'leasttime',
        max_changes:String(MAX_CHANGES),
        calc_number_of_trips:String(TRIPS_PER_CALL),
        language:'sv',
        itd_date:dateStr, itd_time:timeStr,
        calc_one_direction:'true',
        use_near_stops:'true',
        incl_walk:'true',
        use_prox_footpaths:'true'
      });
      for(let i=0;i<=11;i++) p.set(`incl_mot_${i}`,'true');
      return BASE+'?'+p.toString();
    }

    /* ===== Parsing ===== */
    function parseFlex(s){ if(!s) return null; const d=new Date(s); return isNaN(d)?null:d; }
    const firstOf=(o,ks)=>ks.find(k=>o?.[k]!=null)?o[ks.find(k=>o?.[k]!=null)]:null;
    function depFromLeg(l){ return firstOf(l?.origin||{},['departureTimeEstimated','departureTimePlanned','rtDateTime','dateTime']); }
    function arrFromLeg(l){ return firstOf(l?.destination||{},['arrivalTimeEstimated','arrivalTimePlanned','rtDateTime','dateTime']); }
    function legDurationSec(l){
      if (typeof l?.duration === 'number') return l.duration;
      const a=parseFlex(arrFromLeg(l)), d=parseFlex(depFromLeg(l));
      if(a&&d) return Math.max(0,(a-d)/1000); return 0;
    }
    const minutes=sec=>Math.round((sec||0)/60);
    function filterTinyEdgeLegs(legs){
      if(!Array.isArray(legs)||!legs.length) return [];
      let i=0,j=legs.length-1;
      while(i<=j && legDurationSec(legs[i])<60) i++;
      while(j>=i && legDurationSec(legs[j])<60) j--;
      return legs.slice(i,j+1);
    }

    /* ===== Mode detektion ===== */
    function textBag(l){
      const arr=[l?.transportMode,l?.mode,l?.type,
        l?.product?.name,l?.product?.class,l?.product?.category,
        l?.transportation?.name,l?.transportation?.type,l?.transportation?.category,
        l?.transportation?.product?.name,l?.transportation?.product?.class
      ].filter(Boolean).map(x=>String(x));
      return arr.join('|').toUpperCase();
    }
    function extractLineLabel(l){
      const t=l?.transportation||{};
      const lbl=t.disassembledName||t.number||t.name||l?.product?.name||'';
      const short=(String(lbl).match(/(\d+[A-Za-z]?|[A-ZÅÄÖ]{1,3}\s?\d+)/)||[null,lbl])[1];
      return (short||lbl).toString().trim();
    }
    function isWalkLeg(l){
      if(Array.isArray(l?.footPathInfo)&&l.footPathInfo.length) return true;
      const bag=textBag(l);
      if(bag.match(/WALK|FOOT|GÅNG/)) return true;
      if(!extractLineLabel(l)&&!l?.transportation) return true;
      return false;
    }
    function modeOf(l){
      if(isWalkLeg(l)) return 'walk';
      const bag=textBag(l);
      if(bag.match(/FERRY|SHIP|BOAT|BÅT/)) return 'ferry';
      if(bag.match(/METRO|SUBWAY|TUNNEL/)) return 'metro';
      if(bag.match(/TRAM|SPÅRVAGN/)) return 'tram';
      if(bag.match(/RAIL|TRAIN|PENDELTÅG/)) return 'rail';
      if(bag.match(/BUS/)) return 'bus';
      return l?.transportation ? 'bus':'walk';
    }
    function modeEmoji(mode){
      return mode==='metro'?'🚇'
           :mode==='tram'?'🚊'
           :mode==='rail'?'🚆'
           :mode==='ferry'?'⛴️'
           :mode==='walk'?'🚶'
           :'🚌';
    }
    function vehicleTokens(legs){
      const tokens=[];
      for(const l of legs){
        if(isWalkLeg(l)) continue;
        const m=modeOf(l), lbl=extractLineLabel(l);
        tokens.push(`${modeEmoji(m)} ${lbl}`);
      }
      return [...new Set(tokens)];
    }

    /* ===== Rendering ===== */
    function render(list){
      const host=document.getElementById('out');
      if(!list.length){ host.innerHTML='<div class="panel empty">Inga resor hittades.</div>'; return; }
      host.innerHTML=list.map(j=>{
        let legs=filterTinyEdgeLegs(j.legs||[]);
        if(!legs.length) return '';
        const dep=parseFlex(depFromLeg(legs[0]||{})), arr=parseFlex(arrFromLeg(legs[legs.length-1]||{}));
        const dur=minutes(j.tripRtDuration??j.tripDuration);
        const tokens=vehicleTokens(legs).join(' · ');
        const startLabel = forward ? ORIG.name : DEST.name;
        const endLabel   = forward ? DEST.name : ORIG.name;

        return `<div class="journey">
          <div class="summary-row" role="button" aria-expanded="false" tabindex="0">
            <div class="summary-left">
              <span class="pill">${fmtTime(dep)}&nbsp;&nbsp;→&nbsp;&nbsp;${fmtTime(arr)}</span>
              <span class="duration">${dur} min</span>
            </div>
            <div class="lines">${tokens}</div>
            <div class="chev">▸</div>
          </div>
          <div class="divider"></div>
          <div class="details"><div class="legs">${legs.map((l,idx)=>renderLeg(l, idx, legs.length, startLabel, endLabel)).join('')}</div></div>
        </div>`;
      }).join('');
      document.querySelectorAll('.summary-row').forEach(row=>{
        row.addEventListener('click',function(){
          const box=this.parentNode; box.classList.toggle('open');
          this.setAttribute('aria-expanded',box.classList.contains('open')?'true':'false');
        });
      });
    }

    function renderLeg(l, idx, len, startLabel, endLabel){
      const depT=fmtTime(parseFlex(depFromLeg(l))), arrT=fmtTime(parseFlex(arrFromLeg(l)));
      let from=cleanName(l.origin?.name||''), to=cleanName(l.destination?.name||'');
      if (idx === 0)   from = startLabel;
      if (idx === len-1) to = endLabel;

      const mode=modeOf(l);

      if(mode==='walk'){
        const secs=legDurationSec(l);
        const durS=secs?`${minutes(secs)} min`:'';
        return `<div class="leg"><div class="icon walk">🚶</div><div>
          <div class="leg-title">Gång ${durS?`<span class="chip">(${durS})</span>`:''}</div>
          <div class="leg-sub">På: ${from} ${depT}<br>Av: ${to} ${arrT}</div>
        </div></div>`;
      }

      const icon=modeEmoji(mode);
      const line=extractLineLabel(l)||'Linje';
      const dir=cleanName(l.transportation?.destination?.name||l.destination?.name||'');
      return `<div class="leg"><div class="icon ${mode}">${icon}</div><div>
        <div class="leg-title">${line}${dir?` → ${dir}`:''}</div>
        <div class="leg-sub">På: ${from} ${depT}<br>Av: ${to} ${arrT}</div>
      </div></div>`;
    }

    /* ===== Hämtning ===== */
    async function fetchTrips(){
      const from=forward?ORIG:DEST, to=forward?DEST:ORIG;
      const dt=document.getElementById('dt').value;
      let cursor=dt?new Date(dt):nowMinus(5); cursor.setSeconds(0,0);
      const btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='Hämtar…';
      const all=[], seen=new Set();

      for(let b=0;b<MAX_BATCHES;b++){
        const url=buildUrl(from,to,yyyymmdd(cursor),hhmm(cursor));
        dbg(`Batch ${b+1}/${MAX_BATCHES} — ${forward?'Tranholmen→VR':'VR→Tranholmen'} @ ${cursor.toISOString()}`);
        dbg(`URL: ${url}`);
        let res,data=null;
        try{ res=await fetch(url,{headers:{'Accept':'application/json'}}); dbg(`HTTP ${res.status}`); data=await res.json(); }
        catch(e){ dbg(`FEL: ${e.message}`); break; }
        const journeys=data?.journeys||[];
        dbg(`journeys: ${journeys.length}`);
        let latestDep=null;
        for(const j of journeys){
          let legs=filterTinyEdgeLegs(j.legs||[]); if(!legs.length) continue;
          const dep=parseFlex(depFromLeg(legs[0])); const arr=parseFlex(arrFromLeg(legs[legs.length-1]));
          const key=`${dep?.toISOString()||''}_${arr?.toISOString()||''}_${(j.tripRtDuration||j.tripDuration)||0}`;
          if(dep && !seen.has(key)){ seen.add(key); all.push({...j,legs}); }
          if(dep && (!latestDep||dep>latestDep)) latestDep=dep;
        }
        cursor=latestDep&&latestDep>cursor?new Date(latestDep.getTime()+60000):new Date(cursor.getTime()+60000);
      }

      btn.disabled=false; btn.textContent='Hämtar resor';
      all.sort((a,b)=>parseFlex(depFromLeg(a.legs?.[0]||{}))-parseFlex(depFromLeg(b.legs?.[0]||{})));
      render(all);
      if(!all.length) dbg('OBS: Inga resor returnerades.');
    }

    /* ===== Init ===== */
    function setDefaultDatetime(){
      const d=nowMinus(5);
      document.getElementById('dt').value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    document.getElementById('btn').addEventListener('click',()=>{clearResults();fetchTrips();});
    document.getElementById('swapBtn').addEventListener('click',()=>{forward=!forward;updateSwapBtn();clearResults();});
    document.getElementById('dt').addEventListener('change',()=>{clearResults();});
    updateSwapBtn(); setDefaultDatetime();
  </script>
</body>
</html>
