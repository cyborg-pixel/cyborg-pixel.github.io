<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SL-resor</title>
  <style>
    :root{
      --bg:#f6f7f9; --card:#fff; --muted:#667085; --ink:#111; --primary:#0b63f6;
      --walk:#4caf50; --bus:#2563eb; --rail:#7c3aed; --ferry:#03989e; --badge:#eef2ff;
    }
    *{box-sizing:border-box}
    body { font-family: system-ui, sans-serif; padding:20px; background:var(--bg); color:var(--ink) }
    h1 { font-size:1.25rem; margin:0 0 12px }
    .row { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:12px; align-items:end }
    .card { background:var(--card); border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.08); padding:16px; margin:12px 0 }
    label { font-size:.85rem; display:block; margin-bottom:6px; color:#333 }
    input, select { width:100%; padding:10px 12px; border:1px solid #d6d8db; border-radius:10px; background:#fff }
    button { padding:10px 14px; border:0; border-radius:10px; background:var(--primary); color:#fff; font-weight:600; cursor:pointer }
    button:disabled { opacity:.6; cursor:not-allowed }
    .muted { color:var(--muted) }

    /* Journey list */
    .journey{ padding:14px; border:1px solid #e6e8eb; border-radius:12px; margin:12px 0; background:#fff }
    .journey-header{ display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; justify-content:space-between; margin-bottom:8px }
    .title{ display:flex; gap:10px; align-items:center; font-weight:700 }
    .pill { display:inline-flex; gap:6px; align-items:center; padding:3px 8px; border-radius:999px; background:var(--badge); font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
    .chip{ display:inline-block; padding:2px 8px; border-radius:999px; background:#eef; margin-left:6px; font-size:.85rem }
    .legs{ margin-top:6px; }
    .leg{ display:grid; grid-template-columns: 28px 1fr; gap:10px; padding:8px 0; border-top:1px dashed #e5e7eb }
    .leg:first-child{ border-top:0 }
    .icon{ width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:.9rem; font-weight:700 }
    .icon.bus{ background:var(--bus) }
    .icon.walk{ background:var(--walk) }
    .icon.rail{ background:var(--rail) }
    .icon.ferry{ background:var(--ferry) }
    .leg-title{ font-weight:600 }
    .leg-sub{ font-size:.9rem; color:var(--muted) }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
</head>
<body>
  <h1 id="title">Resor</h1>

  <div class="card">
    <div class="row">
      <div>
        <label for="direction">Riktning</label>
        <select id="direction">
          <option value="SG">Svanholmsvägen → Danderyds gymnasium</option>
          <option value="GS">Danderyds gymnasium → Svanholmsvägen</option>
        </select>
      </div>
      <div>
        <label for="dt">Datum & tid (Europe/Stockholm)</label>
        <input id="dt" type="datetime-local" />
        <div class="muted" style="margin-top:6px;font-size:.85rem">Standard: nu − 5 min</div>
      </div>
      <div>
        <label>Max byten</label>
        <input value="3" disabled />
        <div class="muted" style="margin-top:6px;font-size:.85rem">Alltid 3</div>
      </div>
    </div>
    <div style="margin-top:12px; display:flex; gap:10px; align-items:center;">
      <button id="btn">Hämta resor</button>
    </div>
  </div>

  <div id="out-summary" class="card"></div>
  <div id="out" class="card"></div>

  <script>
    // ==== Konstanter ====
    const STOPS = {
      SVANHOLMSVAGEN: { id: "9091001000002103", name: "Svanholmsvägen" },
      DGY:            { id: "9091001000002125", name: "Danderyds gymnasium" }
    };
    const BASE = "https://journeyplanner.integration.sl.se/v2/trips";
    const TZ   = "Europe/Stockholm";
    const MAX_CHANGES = 3;     // alltid 3
    const MAX_BATCHES = 3;     // max 3 hämtningar
    const TRIPS_PER_CALL = 3;  // begär 3 per anrop

    // ==== Tids-hjälpare (förenklade) ====
    const svDate = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit' });
    const svTime = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, hour:'2-digit', minute:'2-digit' });
    const svLong = new Intl.DateTimeFormat('sv-SE', {
      timeZone: TZ, weekday:'short', year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'
    });

    const pad = n => String(n).padStart(2,'0');
    const toTZ = d => new Date(d.toLocaleString('en-US', { timeZone: TZ }));
    function nowMinus(minutes=5){
      const d = toTZ(new Date()); d.setMinutes(d.getMinutes()-minutes); d.setSeconds(0,0); return d;
    }
    function yyyymmdd(d){ return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`; }
    function hhmm(d){ return `${pad(d.getHours())}${pad(d.getMinutes())}`; }
    function fmtDate(d){ return svDate.format(d); }
    function fmtTime(d){ return svTime.format(d); }
    function fmtDateTimeLong(d){ return svLong.format(d).replaceAll('.', ''); } // lite snyggare

    // ==== API-URL (oförändrad logik, men tightare signatur) ====
    function buildTripsUrl(originId, destId, yyyymmdd, hhmm){
      const p = new URLSearchParams({
        type_origin: 'any', name_origin: originId,
        type_destination: 'any', name_destination: destId,
        incl_mot_5: 'true',
        max_changes: String(MAX_CHANGES),
        route_type: 'leasttime',
        calc_number_of_trips: String(TRIPS_PER_CALL),
        language: 'sv',
        itd_date: yyyymmdd,
        itd_time: hhmm,
        calc_one_direction: 'true'
      });
      return BASE + '?' + p.toString();
    }

    // ==== Parser (förenklad men robust) ====
    function parseFlex(s){
      if (!s) return null;
      const d = new Date(s);
      if (!isNaN(d)) return d;
      const digits = String(s).replace(/\D+/g,'');
      if (digits.length >= 12){
        const y=digits.slice(0,4), mo=digits.slice(4,6), da=digits.slice(6,8);
        const hh=digits.slice(8,10), mm=digits.slice(10,12), ss=digits.slice(12,14)||'00';
        const d2 = new Date(`${y}-${mo}-${da}T${hh}:${mm}:${ss}`);
        return isNaN(d2) ? null : d2;
      }
      return null;
    }
    const firstOf = (o, ks) => ks.find(k => o?.[k] != null) ? o[ks.find(k => o?.[k] != null)] : null;
    function depFromLeg(l){
      return firstOf(l?.origin||{}, ['departureTimeEstimated','departureTimePlanned','departureTimeBaseTimetable','rtDateTime','dateTime','dateTimePlanned','plannedDateTime','rtTime','time'])
          || firstOf(l||{}, ['rtDepartureTime','plannedDepartureTime','departure','depTime'])
          || firstOf(l?.destination||{}, ['rtDateTime','dateTime','plannedDateTime','rtTime','time']);
    }
    function arrFromLeg(l){
      return firstOf(l?.destination||{}, ['arrivalTimeEstimated','arrivalTimePlanned','arrivalTimeBaseTimetable','rtDateTime','dateTime','dateTimePlanned','plannedDateTime','rtTime','time','arrDateTime'])
          || firstOf(l||{}, ['rtArrivalTime','plannedArrivalTime','arrival','arrTime'])
          || firstOf(l?.origin||{}, ['rtDateTime','dateTime','plannedDateTime','rtTime','time']);
    }
    const legKind = l => (String(l?.transportMode||'').toUpperCase().includes('WALK') || (!l?.transportation && l?.footPathInfo?.length)) ? 'walk' : 'vehicle';
    const minutes = sec => Math.round((sec||0)/60);

    // ==== Rendering ====
    function renderJourneyCards(list, dirLabel, queryStart){
      const host = document.getElementById('out');
      const title = document.getElementById('title');
      title.textContent = `Resor: ${dirLabel}`;
      if (!list.length){ host.innerHTML = '<div class="muted">Inga resor hittades.</div>'; return; }
      host.innerHTML = list.map(renderJourneyCard).join('');
    }
    function renderJourneyCard(j){
      const legs = j.legs||[];
      const dep = fmtTime(parseFlex(depFromLeg(legs[0]||{})));
      const arr = fmtTime(parseFlex(arrFromLeg(legs[legs.length-1]||{})));
      const dur = minutes(j.tripRtDuration ?? j.tripDuration);
      const changes = (j.interchanges ?? Math.max(0, legs.length-1));
      return `
        <div class="journey">
          <div class="journey-header">
            <div class="title"><span class="pill mono">${dep} → ${arr}</span> <span>${dur} min</span></div>
            <div class="muted">Byten: <strong>${changes}</strong></div>
          </div>
          <div class="legs">
            ${legs.map(renderLeg).join('')}
          </div>
        </div>`;
    }
    function renderLeg(l){
      const kind = legKind(l);
      const depT = fmtTime(parseFlex(depFromLeg(l)));
      const arrT = fmtTime(parseFlex(arrFromLeg(l)));
      if (kind==='walk'){
        const f = l.footPathInfo?.[0]?.footPathElem?.[0];
        const dist = f?.attributes?.distance ? `${f.attributes.distance} m` : '';
        const durS = l.duration ? `${minutes(l.duration)} min` : '';
        const extra = [dist, durS].filter(Boolean).join(' · ');
        return `
          <div class="leg">
            <div class="icon walk">🚶</div>
            <div>
              <div class="leg-title">Gång ${extra?`<span class="chip">${extra}</span>`:''}</div>
              <div class="leg-sub">${depT} → ${arrT}${l.origin?.name?` · från ${l.origin.name}`:''}${l.destination?.name?` till ${l.destination.name}`:''}</div>
            </div>
          </div>`;
      }
      const t = l.transportation||{};
      const line = t.disassembledName || t.number || t.name || l.product?.name || 'Linje';
      const dest = t.destination?.name || l.destination?.parent?.name || l.destination?.name || '';
      return `
        <div class="leg">
          <div class="icon bus">🚌</div>
          <div>
            <div class="leg-title">${line} ${dest?`→ ${dest}`:''}</div>
            <div class="leg-sub">${l.origin?.name||''} ${depT} → ${l.destination?.name||''} ${arrT}</div>
          </div>
        </div>`;
    }

    // ==== Hämta resor (max 3 batches), och skriv ut dag/tid ====
    async function fetchTrips(){
      const dir = document.getElementById('direction').value;
      const from = dir === 'SG' ? STOPS.SVANHOLMSVAGEN : STOPS.DGY;
      const to   = dir === 'SG' ? STOPS.DGY : STOPS.SVANHOLMSVAGEN;
      const dirLabel = `${from.name} → ${to.name}`;

      // Starttid: valt eller nu-5 min
      const dtInput = document.getElementById('dt').value;
      let cursor = dtInput ? new Date(dtInput) : nowMinus(5);
      // Säkerställ SEKUNDER=0 (API:t bryr sig inte, men snyggare)
      cursor.setSeconds(0,0);

      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Hämtar…';

      const all = [];
      const seen = new Set();
      let batches = 0, firstQueryMoment = new Date(cursor);

      try {
        while (batches < MAX_BATCHES) {
          const url = buildTripsUrl(from.id, to.id, yyyymmdd(cursor), hhmm(cursor));
          const res = await fetch(url, { headers: { 'Accept':'application/json' }});
          batches++;
          const data = await res.json();
          const journeys = data?.journeys || [];

          let latestDep = null;
          for (const j of journeys){
            const legs = j.legs || [];
            if (!legs.length) continue;
            const dep = parseFlex(depFromLeg(legs[0]));
            const arr = parseFlex(arrFromLeg(legs[legs.length-1]));
            const key = `${dep?.toISOString()||''}_${arr?.toISOString()||''}_${(j.tripRtDuration||j.tripDuration)||0}`;
            if (dep && !seen.has(key)) { seen.add(key); all.push(j); }
            if (dep && (!latestDep || dep > latestDep)) latestDep = dep;
          }

          // Nästa förfrågan: 1 min efter senaste kända avgång, annars +1 min
          cursor = latestDep && latestDep > cursor ? new Date(latestDep.getTime()+60*1000) : new Date(cursor.getTime()+60*1000);
        }
      } catch (_) {
        // Tyst enligt önskemål (ingen debuginfo)
      } finally {
        btn.disabled = false; btn.textContent = 'Hämta resor';
      }

      // Sortera efter avgång
      all.sort((a,b)=>{
        const da = parseFlex(depFromLeg(a.legs?.[0]||{}))?.getTime()||0;
        const db = parseFlex(depFromLeg(b.legs?.[0]||{}))?.getTime()||0;
        return da - db;
      });

      // Sammanfattning med dag & tid
      const dep0 = all.length ? parseFlex(depFromLeg(all[0].legs?.[0]||{})) : null;
      const depN = all.length ? parseFlex(depFromLeg(all[all.length-1].legs?.[0]||{})) : null;

      document.getElementById('out-summary').innerHTML = `
        <div><strong>${all.length}</strong> resor · ${dirLabel}</div>
        <div class="muted" style="margin-top:6px">
          Gäller: <strong>${fmtDateTimeLong(firstQueryMoment)}</strong>
          ${dep0 ? ` · Avgångar <strong>${fmtTime(dep0)}</strong>–<strong>${fmtTime(depN)}</strong> (${fmtDate(dep0)})` : ''}
        </div>
      `;

      renderJourneyCards(all, dirLabel, firstQueryMoment);
    }

    // ==== Init ====
    function setDefaultDatetime(){
      const d = nowMinus(5);
      const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      document.getElementById('dt').value = val;
    }
    function updateTitle(){
      const dir = document.getElementById('direction').value;
      const from = dir === 'SG' ? STOPS.SVANHOLMSVAGEN : STOPS.DGY;
      const to   = dir === 'SG' ? STOPS.DGY : STOPS.SVANHOLMSVAGEN;
      document.title = `SL-resor: ${from.name} → ${to.name}`;
      document.getElementById('title').textContent = `Resor: ${from.name} → ${to.name}`;
    }

    document.getElementById('btn').addEventListener('click', fetchTrips);
    document.getElementById('direction').addEventListener('change', updateTitle);

    setDefaultDatetime();
    updateTitle();
  </script>
</body>
</html>
