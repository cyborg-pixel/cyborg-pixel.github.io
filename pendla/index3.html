<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buss Danderyds gymnasium</title>
  <style>
    :root{
      --bg:#f6f7f9; --card:#fff; --muted:#667085; --ink:#111; --primary:#0b63f6;
      --walk:#4caf50; --bus:#2563eb; --rail:#7c3aed; --ferry:#03989e; --badge:#eef2ff;
    }
    *{box-sizing:border-box}
    body { font-family: system-ui, sans-serif; padding:20px; background:var(--bg); color:var(--ink) }
    h1 { font-size:1.2rem; margin:0 0 12px }
    .card { background:var(--card); border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.08); padding:16px; margin:12px 0 }
    label { font-size:.85rem; display:block; margin-bottom:6px; color:#333 }
    input { width:100%; padding:8px 10px; border:1px solid #d6d8db; border-radius:8px; background:#fff; font-size:.9rem }
    button { padding:8px 12px; border:0; border-radius:8px; background:var(--primary); color:#fff; font-weight:600; cursor:pointer; font-size:.9rem }
    button:disabled { opacity:.6; cursor:not-allowed }
    .muted { color:var(--muted); font-size:.85rem }

    /* Reselista */
    .journey{ border:1px solid #e6e8eb; border-radius:10px; margin:8px 0; background:#fff; overflow:hidden; font-size:.9rem }
    .summary-row{
      display:flex; align-items:center; justify-content:space-between;
      gap:8px; padding:8px 10px; cursor:pointer; user-select:none;
    }
    .summary-left{ display:flex; gap:8px; align-items:center; font-weight:600; flex-shrink:0 }
    .pill { display:inline-flex; gap:4px; align-items:center; padding:2px 6px; border-radius:6px; background:var(--badge); font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.85rem }
    .duration { font-size:.85rem; color:#334 }
    .lines { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color:#334; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:.85rem; flex-grow:1; text-align:right }
    .chev { margin-left:6px; transition: transform .2s ease; flex-shrink:0 }
    .journey.open .chev { transform: rotate(90deg) }

    .details{ display:none; border-top:1px dashed #e5e7eb; padding:10px }
    .journey.open .details{ display:block }

    /* Legs */
    .legs{ margin-top:6px; }
    .leg{ display:grid; grid-template-columns: 24px 1fr; gap:8px; padding:6px 0; border-top:1px dashed #e5e7eb; font-size:.85rem }
    .leg:first-child{ border-top:0 }
    .icon{ width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:.8rem; font-weight:700 }
    .icon.bus{ background:var(--bus) }
    .icon.walk{ background:var(--walk) }
    .icon.rail{ background:var(--rail) }
    .icon.ferry{ background:var(--ferry) }
    .leg-title{ font-weight:600 }
    .leg-sub{ font-size:.8rem; color:var(--muted) }
    .chip{ display:inline-block; padding:1px 6px; border-radius:999px; background:#eef; margin-left:4px; font-size:.75rem }
  </style>
</head>
<body>
  <h1 id="title">Buss Danderyds gymnasium</h1>

  <div class="card">
    <div style="display:flex; gap:12px; align-items:end; flex-wrap:wrap">
      <div>
        <label>Riktning</label>
        <button id="swapBtn" type="button">Svanholmsvägen → Danderyds gymnasium</button>
      </div>
      <div>
        <label for="dt">Datum & tid (Europe/Stockholm)</label>
        <input id="dt" type="datetime-local" />
      </div>
      <div>
        <button id="btn">Hämta resor</button>
      </div>
    </div>
  </div>

  <div id="out-summary" class="card"></div>
  <div id="out" class="card"></div>

  <script>
    // === Konstanter ===
    const STOPS = {
      SVAN: { id: "9091001000002103", name: "Svanholmsvägen" },
      DGY:  { id: "9091001000002125", name: "Danderyds gymnasium" }
    };
    const BASE = "https://journeyplanner.integration.sl.se/v2/trips";
    const TZ   = "Europe/Stockholm";
    const MAX_CHANGES = 3, MAX_BATCHES = 3, TRIPS_PER_CALL = 3;
    let svanToDgy = true;

    // === Tid/format ===
    const svLong = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, weekday:'short', year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    const svTime = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, hour:'2-digit', minute:'2-digit' });
    const pad = n => String(n).padStart(2,'0');
    const toTZ = d => new Date(d.toLocaleString('en-US',{timeZone:TZ}));
    function nowMinus(min=5){const d=toTZ(new Date());d.setMinutes(d.getMinutes()-min);d.setSeconds(0,0);return d;}
    function yyyymmdd(d){return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;}
    function hhmm(d){return `${pad(d.getHours())}${pad(d.getMinutes())}`;}
    const fmtTime = d=>svTime.format(d);
    const fmtDateTimeLong = d=>svLong.format(d).replaceAll('.','');

    function updateSwapBtn(){
      document.getElementById('swapBtn').textContent = svanToDgy
        ? 'Svanholmsvägen → Danderyds gymnasium'
        : 'Danderyds gymnasium → Svanholmsvägen';
    }

    // === API URL ===
    function buildTripsUrl(originId, destId, dateStr, timeStr){
      const p=new URLSearchParams({
        type_origin:'any',name_origin:originId,
        type_destination:'any',name_destination:destId,
        incl_mot_5:'true',max_changes:String(MAX_CHANGES),
        route_type:'leasttime',calc_number_of_trips:String(TRIPS_PER_CALL),
        language:'sv',itd_date:dateStr,itd_time:timeStr,calc_one_direction:'true'
      });
      return BASE+'?'+p.toString();
    }

    // === Parser ===
    function parseFlex(s){if(!s)return null;const d=new Date(s);if(!isNaN(d))return d;
      const digits=String(s).replace(/\D+/g,'');if(digits.length>=12){
        const y=digits.slice(0,4),mo=digits.slice(4,6),da=digits.slice(6,8);
        const hh=digits.slice(8,10),mm=digits.slice(10,12),ss=digits.slice(12,14)||'00';
        const d2=new Date(`${y}-${mo}-${da}T${hh}:${mm}:${ss}`);return isNaN(d2)?null:d2;}
      return null;}
    const firstOf=(o,ks)=>ks.find(k=>o?.[k]!=null)?o[ks.find(k=>o?.[k]!=null)]:null;
    function depFromLeg(l){return firstOf(l?.origin||{},['departureTimeEstimated','departureTimePlanned','rtDateTime','dateTime'])||firstOf(l||{},['rtDepartureTime','departure'])}
    function arrFromLeg(l){return firstOf(l?.destination||{},['arrivalTimeEstimated','arrivalTimePlanned','rtDateTime','dateTime'])||firstOf(l||{},['rtArrivalTime','arrival'])}

    const legKind=l=>String(l?.transportMode||'').toUpperCase().includes('WALK')?'walk':'vehicle';
    const minutes=sec=>Math.round((sec||0)/60);
    function collectBusLines(legs){const lines=[];for(const l of legs){if(legKind(l)==='vehicle'){const t=l.transportation||{};const lbl=t.number||t.name||'';if(lbl)lines.push(lbl)}}return[...new Set(lines)]}

    // === Rendering ===
    function renderJourneyCards(list, dirLabel){
      const host=document.getElementById('out');
      if(!list.length){host.innerHTML='<div class="muted">Inga resor hittades.</div>';return;}
      host.innerHTML=list.map(renderJourneyEntry).join('');
      host.querySelectorAll('.summary-row').forEach(row=>{
        row.addEventListener('click',function(){
          const box=this.parentNode;box.classList.toggle('open');
        });
      });
    }

    function renderJourneyEntry(j){
      const legs=j.legs||[];
      const dep=parseFlex(depFromLeg(legs[0]||{}));
      const arr=parseFlex(arrFromLeg(legs[legs.length-1]||{}));
      const depHM=fmtTime(dep), arrHM=fmtTime(arr);
      const dur=minutes(j.tripRtDuration??j.tripDuration);
      const lineStr=collectBusLines(legs).join(' · ');
      return `
        <div class="journey">
          <div class="summary-row">
            <div class="summary-left">
              <span class="pill">${depHM}→${arrHM}</span>
              <span class="duration">${dur} min</span>
            </div>
            <div class="lines">🚌 ${lineStr}</div>
            <div class="chev">▶</div>
          </div>
          <div class="details"><div class="legs">${legs.map(renderLeg).join('')}</div></div>
        </div>`;
    }

    function renderLeg(l){
      const kind=legKind(l);
      const depT=fmtTime(parseFlex(depFromLeg(l)));
      const arrT=fmtTime(parseFlex(arrFromLeg(l)));
      if(kind==='walk'){
        const dist=l.footPathInfo?.[0]?.footPathElem?.[0]?.attributes?.distance||'';
        const durS=l.duration?`${minutes(l.duration)} min`:'';const extra=[dist?dist+' m':null,durS].filter(Boolean).join(' · ');
        return `<div class="leg"><div class="icon walk">🚶</div><div><div class="leg-title">Gång ${extra?`<span class="chip">${extra}</span>`:''}</div><div class="leg-sub">${depT}→${arrT}</div></div></div>`;
      }
      const t=l.transportation||{};const line=t.number||t.name||'Linje';const dest=t.destination?.name||'';
      return `<div class="leg"><div class="icon bus">🚌</div><div><div class="leg-title">${line}${dest?` → ${dest}`:''}</div><div class="leg-sub">${depT}→${arrT}</div></div></div>`;
    }

    // === Hämtning ===
    async function fetchTrips(){
      const from=svanToDgy?STOPS.SVAN:STOPS.DGY;const to=svanToDgy?STOPS.DGY:STOPS.SVAN;
      const dirLabel=`${from.name} → ${to.name}`;
      const dtInput=document.getElementById('dt').value;
      let cursor=dtInput?new Date(dtInput):nowMinus(5);cursor.setSeconds(0,0);

      const btn=document.getElementById('btn');btn.disabled=true;btn.textContent='Hämtar…';
      const all=[],seen=new Set(),firstMoment=new Date(cursor);
      try{for(let b=0;b<MAX_BATCHES;b++){const url=buildTripsUrl(from.id,to.id,yyyymmdd(cursor),hhmm(cursor));
        const res=await fetch(url,{headers:{'Accept':'application/json'}});const data=await res.json();const journeys=data?.journeys||[];
        let latestDep=null;
        for(const j of journeys){const legs=j.legs||[];if(!legs.length)continue;
          const dep=parseFlex(depFromLeg(legs[0]));const arr=parseFlex(arrFromLeg(legs[legs.length-1]));
          const key=`${dep?.toISOString()||''}_${arr?.toISOString()||''}_${(j.tripRtDuration||j.tripDuration)||0}`;
          if(dep&&!seen.has(key)){seen.add(key);all.push(j);}if(dep&&(!latestDep||dep>latestDep))latestDep=dep;}
        cursor=latestDep&&latestDep>cursor?new Date(latestDep.getTime()+60000):new Date(cursor.getTime()+60000);}}catch(_){}btn.disabled=false;btn.textContent='Hämta resor';
      all.sort((a,b)=>parseFlex(depFromLeg(a.legs[0]))-parseFlex(depFromLeg(b.legs[0])));
      document.getElementById('out-summary').innerHTML=`<div>${dirLabel}</div><div class="muted" style="margin-top:6px">Gäller: <strong>${fmtDateTimeLong(firstMoment)}</strong></div>`;
      renderJourneyCards(all,dirLabel);
    }

    // === Init ===
    function setDefaultDatetime(){const d=nowMinus(5);const val=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;document.getElementById('dt').value=val;}
    document.getElementById('btn').addEventListener('click',fetchTrips);
    document.getElementById('swapBtn').addEventListener('click',()=>{svanToDgy=!svanToDgy;updateSwapBtn();});
    function updateSwapBtn(){document.getElementById('swapBtn').textContent=svanToDgy?'Svanholmsvägen → Danderyds gymnasium':'Danderyds gymnasium → Svanholmsvägen';}
    setDefaultDatetime();updateSwapBtn();
  </script>
</body>
</html>
