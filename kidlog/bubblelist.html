<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Textapp med Toolbar & Bubbling</title>
<style>
  :root{
    --bg:#0b1220;        /* mörk bakgrund som känns appig */
    --paper:#0f172a;     /* skrivyta */
    --ink:#e5e7eb;       /* textfärg */
    --muted:#9aa4b2;     /* sekundär text */
    --accent:#60a5fa;    /* knappar */
    --accent-2:#93c5fd;
    --danger:#ef4444;
    --ok:#34d399;
    --ring:#1f2a44;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:linear-gradient(180deg,#0b1220,#0b1220 300px,#0b1220);
    color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  }
  /* Top bar */
  .toolbar{
    position:sticky;
    top:0;
    z-index:10;
    backdrop-filter: blur(8px);
    background:rgba(11,18,32,.8);
    border-bottom:1px solid #14203a;
  }
  .toolbar .wrap{
    max-width:1100px;margin:0 auto;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap
  }
  .brand{font-weight:700;letter-spacing:.2px;margin-right:auto;color:#c7d2fe}
  .btn{
    appearance:none;border:1px solid #233055;background:#101a30;color:var(--ink);
    padding:8px 12px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    transition:.15s transform,.15s background,.15s border;
    user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{background:#0f1a35;border-color:#2e3d67}
  .btn:active{transform:translateY(1px)}
  .btn[aria-pressed="true"]{outline:2px solid #1b2a52}
  .btn.small{padding:6px 10px;font-size:14px}
  .btn.primary{background:linear-gradient(180deg,#1b2b52,#132245);border-color:#2b3d6a}
  .btn.primary:hover{background:linear-gradient(180deg,#1d2f5a,#15264c)}
  .sep{width:1px;height:30px;background:#1c2744;margin:0 4px}

  /* Editor area */
  .sheet{
    max-width:1100px;margin:16px auto;padding:12px;
  }
  .editor{
    width:100%;min-height:60vh;resize:vertical; padding:16px 18px 18px 18px;
    background:radial-gradient(1200px 400px at 20% -10%,#112046 0%,#0f172a 45%,#0f172a 100%);
    color:var(--ink); border:1px solid #1b2746;border-radius:16px; outline:none;
    font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    box-shadow: 0 10px 30px rgba(0,0,0,.3), inset 0 0 0 1px #0b1220;
    caret-color:#c7d2fe;
  }
  .editor:focus{box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 3px #132246, inset 0 0 0 1px #0b1220}
  .hint{color:var(--muted);margin-top:8px;font-size:13px}
  kbd{font:12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:2px 6px;border-radius:6px;border:1px solid #263554;background:#0d162c;color:#c7d2fe}

  /* Mobile tweaks */
  @media (max-width:640px){
    .btn span.label{display:none}
    .hint{font-size:12px}
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="wrap">
      <div class="brand">✍️ Textapp</div>

      <!-- Markup (Markdown-lätt) -->
      <button class="btn small" data-action="bold" title="Fetstil (Markdown) – Ctrl/Cmd+B">
        <strong>B</strong><span class="label"> Fet</span>
      </button>
      <button class="btn small" data-action="italic" title="Kursiv – Ctrl/Cmd+I">
        <em>I</em><span class="label"> Kursiv</span>
      </button>
      <button class="btn small" data-action="h1" title="Rubrik H1 (# )">
        H1<span class="label"> Rubrik</span>
      </button>
      <button class="btn small" data-action="h2" title="Rubrik H2 (## )">
        H2
      </button>
      <button class="btn small" data-action="bullet" title="Punktlista (- )">
        •<span class="label"> Punkt</span>
      </button>
      <button class="btn small" data-action="task" title="Att-göra (- [ ] )">
        ☑︎<span class="label"> Todo</span>
      </button>

      <div class="sep" role="separator" aria-hidden="true"></div>

      <!-- Bubbling -->
      <button class="btn small primary" data-action="up" title="Flytta rad(er) upp – Alt+↑">
        ↑<span class="label"> Flytta upp</span>
      </button>
      <button class="btn small primary" data-action="down" title="Flytta rad(er) ned – Alt+↓">
        ↓<span class="label"> Flytta ned</span>
      </button>
    </div>
  </div>

  <div class="sheet">
    <textarea id="editor" class="editor" spellcheck="false" placeholder="Skriv här. Använd Alt+↑ / Alt+↓ för att flytta nuvarande rad eller markerade rader.&#10;&#10;Exempel:&#10;# Rubrik&#10;En vanlig rad&#10;- En punkt&#10;- [ ] En att-göra-rad"></textarea>
    <div class="hint">
      Tips: <kbd>Alt</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> flyttar rad(er). &nbsp;
      <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>B</kbd> fet, <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>I</kbd> kursiv. &nbsp;
      H1/H2 lägger till <code>#</code>-prefix. Punkt/To-do togglar per rad.
    </div>
  </div>

<script>
(function(){
  const ta = document.getElementById('editor');
  const toolbar = document.querySelector('.toolbar');

  // Utilities for line/block math in a textarea
  function lineStart(text, idx){
    if (idx < 0) idx = 0;
    const i = text.lastIndexOf('\n', Math.max(0, idx - 1));
    return i === -1 ? 0 : i + 1;
  }
  function lineEnd(text, idx){
    if (idx < 0) idx = 0;
    const i = text.indexOf('\n', idx);
    return i === -1 ? text.length : i; // position of '\n' or end
  }
  function getBlockRange(){
    const text = ta.value;
    let s = ta.selectionStart, e = ta.selectionEnd;
    if (s > e) [s, e] = [e, s];
    // If selection is empty, take caret's current line.
    const start = lineStart(text, s);
    // Use e-1 so that if the selection ends exactly at a line break, the previous line is included.
    const anchor = Math.max(s, e - 1);
    const end = lineEnd(text, anchor);
    return { start, end };
  }
  function ensureEndsWithNL(str){ return str.endsWith('\n') ? str : (str + '\n'); }

  function setSelectionRelative(oldBlockStart, newBlockStart, oldSelStart, oldSelEnd){
    // Preserve selection relative to the moved block.
    const offS = oldSelStart - oldBlockStart;
    const offE = oldSelEnd - oldBlockStart;
    const ns = Math.max(newBlockStart + offS, newBlockStart);
    const ne = Math.max(newBlockStart + offE, ns);
    ta.setSelectionRange(ns, ne);
  }

function bubbleUp(){
  const text = ta.value;
  const selStart = ta.selectionStart, selEnd = ta.selectionEnd;
  const { start: bS, end: bE } = getBlockRange();
  if (bS === 0) return; // redan överst

  const prevStart = lineStart(text, bS - 1);
  const prevEnd = bS; // exklusivt (början på blocket)

  const beforePrev = text.slice(0, prevStart);
  const prev = text.slice(prevStart, prevEnd); // innehåller sin egen '\n'
  const hasNL = (bE < text.length && text[bE] === '\n');

  const block = text.slice(bS, bE);            // utan trailing '\n'
  const blockWithNL = ensureEndsWithNL(block); // säkerställ separator

  // VIKTIG FIX: hoppa över blockets ursprungliga newline, annars blir det extra tomrad
  const afterBlock = text.slice(bE + (hasNL ? 1 : 0));

  const newText = beforePrev + blockWithNL + prev + afterBlock;
  const newBlockStart = prevStart;

  ta.value = newText;
  setSelectionRelative(bS, newBlockStart, selStart, selEnd);
}
  function bubbleDown(){
    const text = ta.value;
    const selStart = ta.selectionStart, selEnd = ta.selectionEnd;
    const { start: bS, end: bE } = getBlockRange();

    // Identify next line (starts right after current block's '\n' if any)
    const bHasNL = (bE < text.length && text[bE] === '\n');
    const nextStart = bHasNL ? bE + 0 : bE; // if there's a '\n', next starts at that '\n' index (which next slice will include)
    const nextLineStart = bHasNL ? bE + 1 : bE; // actual next line content start

    if (nextLineStart >= text.length) return; // no next line to move past

    const nextEnd = lineEnd(text, nextLineStart);        // at '\n' or end
    const nextHasNL = (nextEnd < text.length && text[nextEnd] === '\n');
    const beforeBlock = text.slice(0, bS);
    // block segment (retain original; if it lacked NL, keep it that way)
    const block = text.slice(bS, bE);
    const blockWithNL = ensureEndsWithNL(block);         // to separate when placed after next
    // next segment includes own trailing newline if present
    const next = text.slice(nextLineStart, nextHasNL ? nextEnd + 1 : nextEnd);
    const afterNext = text.slice(nextHasNL ? nextEnd + 1 : nextEnd);

    const newText = beforeBlock + next + blockWithNL + afterNext;
    // New block starts after 'beforeBlock + next'
    const newBlockStart = beforeBlock.length + next.length;
    ta.value = newText;
    setSelectionRelative(bS, newBlockStart, selStart, selEnd);
  }

  // ----- Markup helpers -----
  function wrapSelection(prefix, suffix = prefix){
    const v = ta.value;
    let s = ta.selectionStart, e = ta.selectionEnd;
    if (s > e) [s, e] = [e, s];
    const selected = v.slice(s, e);
    const before = v.slice(0, s);
    const after = v.slice(e);
    ta.value = before + prefix + selected + suffix + after;
    const ns = s + prefix.length;
    const ne = ns + selected.length;
    ta.setSelectionRange(ns, ne);
    ta.focus();
  }
  function toggleLinePrefix(prefix){
    const v = ta.value;
    const { start, end } = getBlockRange();
    // operate line-by-line in the selection block
    const block = v.slice(start, end);
    const lines = block.split('\n');
    const allHave = lines.every(l => l.startsWith(prefix));
    const newLines = lines.map(l => allHave ? l.replace(new RegExp('^' + escapeRegExp(prefix)), '') : (prefix + l));
    const newBlock = newLines.join('\n');
    ta.value = v.slice(0, start) + newBlock + v.slice(end);
    // restore selection to entire transformed block
    ta.setSelectionRange(start, start + newBlock.length);
    ta.focus();
  }
  function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function toggleHeading(level){
    const hashes = '#'.repeat(level) + ' ';
    // If single line selection and it already has same heading, remove; else set (replace any existing #+spaces)
    const v = ta.value;
    const { start, end } = getBlockRange();
    const before = v.slice(0, start);
    const block = v.slice(start, end);
    const after = v.slice(end);
    const lines = block.split('\n');
    const newBlock = lines.map(l => {
      // strip any existing leading markdown heading "###... "
      const stripped = l.replace(/^#{1,6}\s+/,'');
      // toggle: if l already starts with exactly this heading, remove; else apply
      if (l.startsWith(hashes)) return stripped;
      return hashes + stripped;
    }).join('\n');
    ta.value = before + newBlock + after;
    ta.setSelectionRange(start, start + newBlock.length);
    ta.focus();
  }

  // Toolbar clicks
  toolbar.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-action');
    ta.focus();
    if (action === 'up') return bubbleUp();
    if (action === 'down') return bubbleDown();
    if (action === 'bold') return wrapSelection('**');
    if (action === 'italic') return wrapSelection('*');
    if (action === 'h1') return toggleHeading(1);
    if (action === 'h2') return toggleHeading(2);
    if (action === 'bullet') return toggleLinePrefix('- ');
    if (action === 'task') return toggleLinePrefix('- [ ] ');
  });

  // Keyboard shortcuts
  ta.addEventListener('keydown', (e)=>{
    // Bubble with Alt+Up/Down (Option on mac)
    if (e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey){
      if (e.key === 'ArrowUp'){ e.preventDefault(); bubbleUp(); }
      if (e.key === 'ArrowDown'){ e.preventDefault(); bubbleDown(); }
    }
    // Markdown wrap on Ctrl/Cmd+B / Ctrl/Cmd+I
    if ((e.ctrlKey || e.metaKey) && !e.altKey){
      if (e.key.toLowerCase() === 'b'){ e.preventDefault(); wrapSelection('**'); }
      if (e.key.toLowerCase() === 'i'){ e.preventDefault(); wrapSelection('*'); }
    }
  });

  // Seed sample text for demo
  ta.value = [
    '# Rubrik – tryck H1 igen för att ta bort',
    'Det här är en vanlig rad.',
    '- En punkt i en lista',
    '- [ ] En att-göra-rad',
    'Ytterligare text för att testa flytt upp/ner.',
    'Sista raden utan newline'
  ].join('\n');

})();
</script>
</body>
</html>
